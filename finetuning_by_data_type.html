<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine-Tuning Pipeline — By Data Type</title><!-- cache-bust-20260729 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fc;--card:#fff;--border:#dde0e6;--text:#1a1d23;--tdim:#4a4f5b;--tmut:#8b909b;--violet:#5b3aa8;--vbg:#f3effc;--green:#1a6e34;--amber:#b87000;--red:#c62828;--cyan:#007a99;--magenta:#9e2a6b;--blue:#2979ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;}
.app{max-width:1000px;margin:0 auto;padding:1.5rem;}

.header{text-align:center;padding:1.5rem 0 1rem;}
.header .title-row{display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:0.5rem;}
.header .mega-emoji{font-size:3rem;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:var(--violet);}
.header .subtitle{color:var(--tdim);font-size:0.9rem;margin-top:0.2rem;}

/* Tabs */
.tabs{display:flex;gap:0.3rem;justify-content:center;margin:1rem 0;flex-wrap:wrap;}
.tab{font-family:'Space Grotesk',sans-serif;font-size:0.65rem;font-weight:600;padding:0.5em 1.2em;border:2px solid var(--border);border-radius:100px;background:var(--card);color:var(--tmut);cursor:pointer;transition:0.15s;display:flex;align-items:center;gap:0.3em;}
.tab:hover{border-color:var(--violet);color:var(--violet);}
.tab.active{background:var(--violet);border-color:var(--violet);color:#fff;}
.tab .tb-emoji{font-size:0.9rem;}

/* Metrics row */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin:1rem 0;}
.metric{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;}
.metric .val{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;}
.metric .lbl{font-size:0.6rem;color:var(--tmut);margin-top:0.15rem;text-transform:uppercase;letter-spacing:0.06em;}

/* Pipeline */
.pipeline-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin:1rem 0;}
.pipeline-label{font-family:'Space Grotesk',sans-serif;font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--tmut);text-align:center;margin-bottom:1rem;}

.pipeline{display:flex;align-items:flex-start;justify-content:center;gap:0;flex-wrap:wrap;}
.pipe-stage{text-align:center;padding:1rem 1.2rem;border-radius:14px;cursor:pointer;transition:0.2s;min-width:130px;max-width:160px;border:2px solid var(--border);background:rgba(255,255,255,0.5);}
.pipe-stage:hover{border-color:var(--violet);transform:translateY(-3px);box-shadow:0 6px 24px rgba(91,58,168,0.1);}
.pipe-stage.active-stage{border-color:var(--violet);background:var(--vbg);box-shadow:0 0 0 4px rgba(91,58,168,0.08);}
.pipe-stage .st-emoji{font-size:2rem;display:block;margin-bottom:0.4rem;}
.pipe-stage .st-name{font-family:'Space Grotesk',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.pipe-stage .st-time{font-size:0.55rem;color:var(--tmut);margin-top:0.2rem;}
.pipe-stage .st-desc{font-size:0.55rem;color:var(--tdim);margin-top:0.2rem;line-height:1.3;}

.pipe-arrow{display:flex;align-items:center;padding:0 0.4rem;color:var(--violet);font-size:1.8rem;font-weight:300;margin-top:1rem;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}

/* Substeps dropdown */
.substeps{background:var(--vbg);border:1px solid var(--violet);border-radius:12px;padding:1.25rem;margin:1.25rem 0 0;display:none;}
.substeps.show{display:block;animation:slideDown 0.3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.substeps h4{font-family:'Space Grotesk',sans-serif;font-size:0.75rem;color:var(--violet);margin-bottom:0.75rem;}
.substep-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;}
.substep{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.75rem;}
.substep .ss-num{font-family:'Space Grotesk',sans-serif;font-size:0.55rem;color:var(--violet);font-weight:700;}
.substep .ss-title{font-weight:600;font-size:0.75rem;margin:0.2rem 0;}
.substep .ss-code{font-family:'Space Grotesk',monospace;font-size:0.6rem;color:var(--tdim);background:rgba(0,0,0,0.03);padding:0.3rem 0.5rem;border-radius:4px;margin-top:0.3rem;white-space:pre-wrap;}
.substep .ss-tag{display:inline-block;font-size:0.5rem;padding:1px 6px;border-radius:100px;margin-top:0.3rem;}
.substep .ss-viz{display:flex;align-items:center;gap:0.3rem;margin:0.4rem 0;font-size:0.65rem;flex-wrap:wrap;}
.ss-viz .vz-box{background:var(--card);border:1.5px solid var(--border);border-radius:6px;padding:0.25rem 0.5rem;font-weight:600;font-family:'Space Grotesk',sans-serif;font-size:0.55rem;display:flex;align-items:center;gap:0.2rem;}
.ss-viz .vz-arrow{color:var(--violet);font-weight:700;}
.ss-viz .vz-input{border-color:var(--amber);background:rgba(184,112,0,0.04);}
.ss-viz .vz-process{border-color:var(--violet);background:var(--vbg);}
.ss-viz .vz-output{border-color:var(--green);background:rgba(26,110,52,0.04);}
.ss-tag.lora{background:var(--vbg);color:var(--violet);}
.ss-tag.sft{background:rgba(184,112,0,0.1);color:var(--amber);}
.ss-tag.dpo{background:rgba(158,42,107,0.1);color:var(--magenta);}

/* Nav */
.nav-row{display:flex;justify-content:center;align-items:center;gap:0.75rem;margin:1.25rem 0;}
.nav-btn{font-family:'Space Grotesk',sans-serif;font-size:0.65rem;font-weight:600;padding:0.45em 1.2em;border:2px solid var(--border);border-radius:100px;background:var(--card);color:var(--text);cursor:pointer;transition:0.15s;}
.nav-btn:hover{border-color:var(--violet);color:var(--violet);}
.nav-btn:disabled{opacity:0.25;cursor:not-allowed;}

/* Perf highlight */
.perf-banner{display:flex;align-items:center;justify-content:center;gap:0.75rem;padding:0.75rem 1.5rem;background:var(--card);border:1px solid var(--border);border-radius:12px;margin:0.75rem 0;flex-wrap:wrap;}
.perf-item{text-align:center;}
.perf-item .pv{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;}
.perf-item .pl{font-size:0.55rem;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em;}
.perf-divider{width:1px;height:30px;background:var(--border);}

/* Comparison */
.comparison{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin:1rem 0;}
.comparison h3{font-family:'Space Grotesk',sans-serif;font-size:0.75rem;color:var(--violet);margin-bottom:0.75rem;text-align:center;text-transform:uppercase;letter-spacing:0.1em;}
.tbl{width:100%;border-collapse:collapse;font-size:0.7rem;}
.tbl th{font-size:0.55rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--tmut);padding:0.35rem;border-bottom:2px solid var(--border);text-align:center;}
.tbl td{padding:0.35rem;border-bottom:1px solid var(--border);text-align:center;}
.tbl td:first-child{text-align:left;font-weight:600;}
.tbl .yes{color:var(--green);font-weight:700;}
.tbl .no{color:var(--red);}

.callout{background:var(--vbg);border:1px solid rgba(91,58,168,0.15);border-radius:10px;padding:0.6rem 1rem;margin:0.75rem 0;font-size:0.78rem;text-align:center;}

@media(max-width:768px){.pipeline{flex-direction:column;align-items:center;}.pipe-arrow{transform:rotate(90deg);margin:0;}.metrics{grid-template-columns:1fr 1fr;}.substep-grid{grid-template-columns:1fr;}.perf-banner{gap:0.5rem;}}
</style>
</head>
<body>

<div class="app">

<header class="header">
  <div class="title-row">
    <span class="mega-emoji">🔄</span>
    <h1>Fine-Tuning Pipeline Visualizer</h1>

  <p class="subtitle">Click any stage, then step through its sub-operations. Same pattern across Text, Tabular, Image & Vision-Language.</p>
</header>

  <button class="tab" onclick="switchTab(2)"><span class="tb-emoji">🖼️</span> Image FT</button>
  <button class="tab" onclick="switchTab(3)"><span class="tb-emoji">🖼️📝</span> Vision-Lang FT</button>
  <button class="tab" onclick="switchTab(4)"><span class="tb-emoji">🔄</span> Lifecycle</button>
  <button class="tab" onclick="switchTab(5)"><span class="tb-emoji">🚀</span> Deploy: YOLO vs LLM</button>
  <button class="tab" onclick="switchTab(6)"><span class="tb-emoji">🔧</span> Sensor FT</button>
  <button class="tab" onclick="switchTab(7)"><span class="tb-emoji">🛰️</span> LIDAR FT</button>

<script>
// ── PIPELINE DATA ──
const tabs=[
{ // 0: TEXT
  name:'📝 Text Fine-Tuning', phases:'Phases 4–6',
  metrics:[
    {val:'SFT + DPO',lbl:'Training Methods',color:'var(--amber)'},
    {val:'SFTTrainer',lbl:'Phase 5 Trainer',color:'var(--violet)'},
    {val:'DPOTrainer',lbl:'Phase 6 Trainer',color:'var(--magenta)'},
    {val:'LoRA (0.4%)',lbl:'Trainable Params',color:'var(--green)'},
  ],
  banner:[
    {val:'SFT',lbl:'Phase 5',color:'var(--amber)'},
    {val:'DPO',lbl:'Phase 6',color:'var(--magenta)'},
    {val:'4 MB',lbl:'Adapter Size',color:'var(--green)'},
    {val:'< 5 min',lbl:'Colab T4',color:'var(--blue)'},
  ],
  stages:[
    {emoji:'📋',name:'PREPROCESS',time:'~2 min',desc:'Q&A → Alpaca template',
     substeps:[
       {n:1,title:'Write Q&A Pairs (✍️ Manual or 🤖 GPT-4o)',tag:'data',viz:'<span class="vz-box vz-input">📝 Questions<br>You write or<br>GPT-4o generates</span><span class="vz-arrow">+</span><span class="vz-box vz-input">✅ Answers<br>From domain<br>knowledge</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📋 instruction_data.json<br>5 to 10,000+ pairs</span>',code:'# DATA SOURCE: You write Q&A pairs (or GPT-4o generates them)\n# File: instruction_data.json (Alpaca format)\n# 3 fields: instruction + input (optional) + output\n\ninstruction_data = [\n    {\n        "instruction": "What is Metformin?",\n        "input": "",  # Optional context\n        "output": "Metformin is a biguanide antihyperglycemic\n                  agent used to treat type 2 diabetes mellitus."\n    },\n    {\n        "instruction": "How does Metformin work?",\n        "input": "",\n        "output": "It decreases hepatic glucose production and\n                  improves peripheral insulin sensitivity."\n    },\n    # ... 5-50 pairs for testing, 500-10K for production\n]\n\n# 🤖 Auto-generate with GPT-4o (Phase 5.4):\n# Feed PDF chunk → GPT-4o → "Generate 5 Q&A from this text"\n\n# ✍️ Manual: you write pairs from your domain knowledge'},
       {n:2,title:'Format as Alpaca (🤖 Automatic)',tag:'sft',viz:'<span class="vz-box vz-input">📋 instruction_data.json<br>3 fields per row</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔤 format_instruction()<br>fills the template</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📄 One long string<br>with ### markers</span>',code:'# 🔑 JSON → Training String (LLMs read ONE string)\ndef format_instruction(example):\n    if example["input"]:\n        text = "Below is an instruction and input. "\n               "Write a response.\\n\\n"\n        text += "### Instruction:\\n" + example["instruction"] + "\\n\\n"\n        text += "### Input:\\n" + example["input"] + "\\n\\n"\n        text += "### Response:\\n" + example["output"]\n    else:\n        text = "Below is an instruction. Write a response.\\n\\n"\n        text += "### Instruction:\\n" + example["instruction"] + "\\n\\n"\n        text += "### Response:\\n" + example["output"]\n    return {"text": text}\n\n# BEFORE (JSON): {"instruction":"Q","output":"A"}\n# AFTER (String): "### Instruction:\\nQ\\n\\n### Response:\\nA"'},
       {n:3,title:'Tokenize (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">📄 Alpaca String</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔢 AutoTokenizer<br>32K vocab</span><span class="vz-arrow">→</span><span class="vz-box vz-output">[1, 464, 8522...]<br>512 integers</span>',code:'# Convert text → integers the model can process\n# Each word/subword maps to an integer (vocab of 32,000)\n\ndef tokenize(examples):\n    return tokenizer(\n        examples["text"],\n        truncation=True,         # Cut if > 512 tokens\n        padding="max_length",    # Pad shorter to 512\n        max_length=512           # Standard context window\n    )\n\ntokenized = dataset.map(tokenize, batched=True)\n# Now each example has: input_ids, attention_mask\n# "Metformin" → [464, 8522] (subword: Met + formin)'},
       {n:4,title:'Set Labels (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">🔢 input_ids<br>[1, 464, 8522...]</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📋 .copy()<br>Self-Supervised!</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🎯 labels<br>IDENTICAL to input</span>',code:'# 🎯 THE MAGIC: labels = input_ids.copy()\n# No human labeling! The text IS the label.\n# Model learns: predict next token from previous tokens\n\ndef add_labels(examples):\n    examples["labels"] = examples["input_ids"].copy()\n    return examples\n\ntokenized = tokenized.map(add_labels, batched=True)\n\n# Input:  "### Instruction: What is Metformin? ### Response:"\n# Label:  "Metformin is a biguanide antihyperglycemic agent..."\n# Model sees input, must predict label — ONE token at a time.\n# Loss computed ONLY on the response part (instruction masked).'},
     ]},
    {emoji:'🧠',name:'TRAIN',time:'~3 min',desc:'LoRA → SFT → DPO',
     substeps:[
       {n:1,title:'Quantize Base Model (🤖 Auto)',tag:'lora',viz:'<span class="vz-box vz-input">🧠 FP16 (2.2GB)</span><span class="vz-arrow">→</span><span class="vz-box vz-process">⬇ BitsAndBytes 8-bit</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🧠 INT8 (1.1GB)</span>',code:'# Phase 2 in action! Quantization reduces memory.\nfrom transformers import BitsAndBytesConfig\nimport torch\n\nbnb_config = BitsAndBytesConfig(load_in_8bit=True)\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    "TinyLlama/TinyLlama-1.1B-Chat-v1.0",\n    quantization_config=bnb_config,\n    device_map="auto",\n    torch_dtype=torch.float16\n)\nmodel.config.use_cache = False  # Saves memory during training\n\n# 2.2GB (FP16) → 1.1GB (INT8). Fits on free Colab T4!'},
       {n:2,title:'Apply LoRA — r=8, alpha=16 (🤖 Auto)',tag:'lora',viz:'<span class="vz-box vz-input">🔒 W₀ Frozen (1.1B)</span><span class="vz-arrow">+</span><span class="vz-box vz-process">🆕 B×A (4MB, 0.4%)</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ LoRA Model</span>',code:'# B and A are NEW matrices, NOT derived from W₀!\n# B=random(Gaussian), A=ALL ZEROS (so B×A=0 at start)\nfrom peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training\n\nmodel = prepare_model_for_kbit_training(model)\n\nlora_config = LoraConfig(\n    r=8,              # Rank — 8 patterns\n    lora_alpha=16,    # Scaling = alpha/r = 2×\n    lora_dropout=0.1, # 10% dropout for regularization\n    target_modules=["q_proj", "v_proj"],\n    bias="none",\n    task_type="CAUSAL_LM"\n)\nmodel = get_peft_model(model, lora_config)\nmodel.print_trainable_parameters()\n# → trainable: 1.1M || frozen: 1.1B || trainable%: 0.10%'},
       {n:3,title:'SFT — Supervised Fine-Tuning (Phase 5)',tag:'sft',viz:'<span class="vz-box vz-input">📋 tokenized Q&A pairs</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🎓 SFTTrainer<br>lr=2e-4, epochs=10</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🤖 Instruction Model<br>+ adapter_model.safetensors</span>',code:'# SFT teaches the model WHAT to say (content)\n# Response-only masking: model learns ONLY the answer part\nfrom transformers import TrainingArguments\nfrom trl import SFTTrainer\n\ntraining_args = TrainingArguments(\n    output_dir="./instruction_tuned",\n    num_train_epochs=10,               # 10 epochs (small dataset)\n    per_device_train_batch_size=4,\n    gradient_accumulation_steps=4,      # Effective batch=16\n    learning_rate=2e-4,                 # 0.0002 — standard QLoRA lr\n    lr_scheduler_type="cosine",\n    warmup_steps=100,\n    logging_steps=5,\n    save_steps=200,\n    save_total_limit=2,\n)\n\ntrainer = SFTTrainer(\n    model=model,\n    train_dataset=tokenized_dataset,\n    formatting_func=format_instruction,  # Alpaca template\n    args=training_args,\n)\ntrainer.train()  # Forward→Loss→Backward(STE)→Adam→Repeat\n\n# Output: instruction_tuned/adapter_model.safetensors (4MB)'},
       {n:4,title:'DPO — Direct Preference Optimization (Phase 6)',tag:'dpo',viz:'<span class="vz-box vz-input">👍 Chosen (good)<br>vs<br>👎 Rejected (bad)</span><span class="vz-arrow">→</span><span class="vz-box vz-process">⚖️ DPOTrainer<br>beta=0.1, lr=5e-5</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🤖 Aligned Model<br>(thorough, helpful)</span>',code:'# DPO teaches the model HOW to deliver (tone, thoroughness)\n# "Be more like chosen, less like rejected"\nfrom trl import DPOTrainer\n\n# Preference data: prompt + chosen (good) + rejected (bad)\npreference_data = [{\n    "prompt": "What is Metformin?",\n    "chosen": "Metformin is an oral medication used to treat...",\n    "rejected": "Metformin is a drug. It helps with sugar."\n}]\n\ndpo_args = TrainingArguments(\n    output_dir="./dpo_aligned",\n    num_train_epochs=3,\n    per_device_train_batch_size=4,\n    learning_rate=5e-5,    # Smaller than SFT (2e-4)\n    logging_steps=5,\n)\n\ntrainer = DPOTrainer(\n    model=model,          # MUST merge SFT adapter first!\n    train_dataset=Dataset.from_list(preference_data),\n    args=dpo_args,\n    beta=0.1,             # Preference strength (0.1=gentle)\n)\ntrainer.train()\n\n# Output: dpo_aligned/adapter_model.safetensors (4MB)'},
     ]},
    {emoji:'🚀',name:'DEPLOY',time:'~1 min',desc:'Save → Merge → Serve',
     substeps:[
       {n:1,title:'Save Adapter (4 MB)',tag:'lora',viz:'<span class="vz-box vz-input">🧠 Model</span><span class="vz-arrow">→</span><span class="vz-box vz-process">💾 save_pretrained()</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📁 adapter_model.safetensors (4MB)</span>',code:'# Save the trained LoRA adapter (4MB only — NOT the base model)\nmodel.save_pretrained("./instruction_tuned_adapter")\ntokenizer.save_pretrained("./instruction_tuned_adapter")\n\n# 📁 Files created:\n#   adapter_model.safetensors (4MB) — B_q×A_q + B_v×A_v weights\n#   adapter_config.json (1KB) — r=8, alpha=16, config\n#   tokenizer.json — needed for text→IDs\n\n# Anyone with TinyLlama can use your 4MB adapter!'},
       {n:2,title:'Merge for Production',tag:'lora',viz:'<span class="vz-box vz-input">W₀ + B×A</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔀 merge_and_unload()</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🧠 merged_model.safetensors (2.2GB)</span>',code:'# Phase 3.10 Golden Rule: Merge before deployment or next stage!\n# Bakes B×A into W₀ → one normal model. B and A DELETED.\nmodel = model.merge_and_unload()\n\n# Before: PeftModel (W₀ frozen + B×A active side path)\n# After:  Plain AutoModelForCausalLM (W₀+B×A baked in)\n# No LoRA dependency! Load with normal transformers.\n\nmodel.save_pretrained("./merged_medical_model")\ntokenizer.save_pretrained("./merged_medical_model")\n# 📁 Single merged_model.safetensors (2.2GB)'},
       {n:3,title:'Serve with vLLM',tag:'dpo',viz:'<span class="vz-box vz-input">🧠 Model</span><span class="vz-arrow">→</span><span class="vz-box vz-process">⚡ vLLM (5000 tok/s)</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🌐 API :8000</span>',code:'vllm serve ./merged_model --port 8000'},
       {n:4,title:'Monitor & Retrain',tag:'sft',viz:'<span class="vz-box vz-input">📊 Metrics</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔍 Evidently AI</span><span class="vz-arrow">→</span><span class="vz-box vz-output">⚠️ Drift? → Retrain!</span>',code:'Evidently AI drift check → auto-retrain trigger'},
     ]},
  ]
},
{ // 1: TABULAR
  name:'📊 Tabular Fine-Tuning', phases:'Anytime — Same as Text',
  metrics:[
    {val:'SFT',lbl:'Training Method',color:'var(--amber)'},
    {val:'Row→Sentence',lbl:'Key Trick',color:'var(--cyan)'},
    {val:'SFTTrainer',lbl:'Same Trainer',color:'var(--violet)'},
    {val:'LoRA (0.4%)',lbl:'Trainable Params',color:'var(--green)'},
  ],
  banner:[
    {val:'Row→Text',lbl:'Only Difference',color:'var(--cyan)'},

       {n:2,title:'Row → Sentence',tag:'data',viz:'<span class="vz-box vz-input">📊 Row</span><span class="vz-arrow">→</span><span class="vz-box vz-process">✍️ f-string</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 "Age: 45, BP: 140..."</span>',code:'# Step 2: Convert each row into an English sentence\n# This is THE ONLY difference from text FT!\n# LLMs read sentences, not numbers. So describe the row in words.\n\ndef row_to_sentence(row):\n    return (f"Age: {row[\"age\"]}. "\n            f"Blood Pressure: {row[\"bp\"]} mmHg. "\n            f"Glucose: {row[\"glucose\"]} mg/dL. "\n            f"Cholesterol: {row[\"cholesterol\"]} mg/dL.")\n\n# Example:\n# Input row:  {age: 45, bp: 140, glucose: 110, cholesterol: 220}\n# Output sentence: "Age: 45. Blood Pressure: 140 mmHg. Glucose: 110 mg/dL. Cholesterol: 220 mg/dL."\n# ─── sentences passed to Step 3 ───→'},
       {n:3,title:'Create Q&A Format',tag:'sft',viz:'<span class="vz-box vz-input">📝 Sentence</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📋 JSON</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ Q&A Pair</span>',code:'# Step 3: Wrap each sentence into a Q&A pair (Alpaca format)\n# Same format as text FT! Just different content.\n\ninstruction_data = []\nfor _, row in df.iterrows():\n    instruction_data.append({\n        "instruction": "Diagnose this patient based on the following data",\n        "input": row_to_sentence(row),       # From Step 2\n        "output": row["diagnosis"]            # The label (from CSV)\n    })\n\n# Example output (one Q&A pair):\n# {\n#   "instruction": "Diagnose this patient based on the following data",\n#   "input": "Age: 45. Blood Pressure: 140 mmHg. Glucose: 110 mg/dL. Cholesterol: 220 mg/dL.",\n#   "output": "Diabetic"\n# }\n# ─── instruction_data passed to Step 4 ───→'},
       {n:4,title:'Tokenize + Labels',tag:'data',viz:'<span class="vz-box vz-input">📝 Text</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔢 Tokenizer</span><span class="vz-arrow">→</span><span class="vz-box vz-output">[464, 8522...]</span>',code:'# Step 4: Format to Alpaca string → Tokenize → Add Labels\n# IDENTICAL to text FT from here onwards!\n\nfrom datasets import Dataset\nfrom transformers import AutoTokenizer\n\ntokenizer = AutoTokenizer.from_pretrained("TinyLlama/TinyLlama-1.1B-Chat-v1.0")\ntokenizer.pad_token = tokenizer.eos_token\n\n# Format each Q&A into Alpaca string (SAME function as text FT!)\ndef format_instruction(example):\n    text = "Below is an instruction. Write a response.\\n\\n"\n    text += "### Instruction:\\n" + example["instruction"] + "\\n\\n"\n    if example["input"]:  # Tabular data HAS input (the patient data)\n        text += "### Input:\\n" + example["input"] + "\\n\\n"\n    text += "### Response:\\n" + example["output"]\n    return {"text": text}\n\n# Create dataset\ndataset = Dataset.from_list(instruction_data)\ndataset = dataset.map(format_instruction)\n\n# Tokenize\ndef tokenize(examples):\n    return tokenizer(examples["text"], truncation=True,\n                     padding="max_length", max_length=512)\ndataset = dataset.map(tokenize, batched=True)\n\n# Add labels\ndef add_labels(examples):\n    examples["labels"] = examples["input_ids"].copy()\n    return examples\ndataset = dataset.map(add_labels, batched=True)\n\n# ✅ "dataset" ready for TRAIN Step 3 (SFTTrainer)!'},
     ]},

       {n:2,title:'Apply LoRA (🤖 Auto)',tag:'lora',viz:'<span class="vz-box vz-input">🔒 W₀ Frozen</span><span class="vz-arrow">+</span><span class="vz-box vz-process">🆕 B×A (4MB)</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ 0.4% Trainable</span>',code:'# B and A are NEW matrices. NOT from W₀!\nfrom peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training\nmodel = prepare_model_for_kbit_training(model)\nlora_config = LoraConfig(r=8, lora_alpha=16,\n    target_modules=["q_proj","v_proj"])\nmodel = get_peft_model(model, lora_config)\nmodel.print_trainable_parameters()'},
       {n:3,title:'SFTTrainer (formatting done in PREPROCESS)',tag:'sft',viz:'<span class="vz-box vz-input">📋 tokenized dataset</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🎓 SFTTrainer</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🤖 Diagnosis Model</span>',code:'# 📥 "dataset" already formatted & tokenized (PREPROCESS Step 4)\n# 📥 format_instruction already applied (PREPROCESS Step 4)\nfrom transformers import TrainingArguments\nfrom trl import SFTTrainer\ntraining_args = TrainingArguments(\n    output_dir="./tabular_diagnosis",\n    num_train_epochs=10, per_device_train_batch_size=4,\n    learning_rate=2e-4, logging_steps=5,\n)\ntrainer = SFTTrainer(model=model, train_dataset=dataset,\n    formatting_func=format_instruction, args=training_args)\ntrainer.train()'},
       {n:4,title:'Model Now Diagnoses Patients',tag:'sft',viz:'<span class="vz-box vz-input">📊 New Patient</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🤖 Trained Model</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 "Diabetic"</span>',code:'# Model learned: Age>60+Glucose>120+BP>140 → Diabetic\npipe = pipeline("text-generation", model=model)\nprompt = "### Instruction: Diagnose\\n### Input: Age: 67, BP: 160, Glucose: 130\\n### Response:"\nresult = pipe(prompt, max_new_tokens=50)\n# → "Diabetic. Recommend HbA1c test and lifestyle changes."'},

       {n:4,title:'Load Pre-trained',tag:'data',viz:'<span class="vz-box vz-input">🌐 COCO Dataset</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🧠 YOLOv8n.pt</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ Model Ready</span>',code:'# Load pre-trained model (trained on COCO: 80 classes, 118K images)\nfrom ultralytics import YOLO\n\nmodel = YOLO("yolov8n.pt")  # 3.2M params, nano version — fastest\n# Also available: yolov8s.pt (11M), yolov8m.pt (26M), yolov8l.pt (44M)\n# Backbone already knows: edges, shapes, textures, objects'},

{ // 3: VISION-LANGUAGE

  ],
  stages:[
    {emoji:'📋',name:'PREPROCESS',time:'~2 min',desc:'Image+Q → Text',
     substeps:[
       {n:1,title:'Create Pairs',tag:'data',viz:'<span class="vz-box vz-input">🖼️ Image</span><span class="vz-arrow">+</span><span class="vz-box vz-input">📝 Question</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📋 Q&A Pair</span>',code:'# Step 1: Create image-question-answer pairs\n# Same format as text FT, just add "image" field!\ndata = [{\n    "image": "chest_xray_001.jpg",  # ← Path to image file (local or URL)\n    "instruction": "What does this chest X-ray show?",\n    "output": "Bilateral pneumonia with consolidation in the right lower lobe."\n},{\n    "image": "chest_xray_002.jpg",\n    "instruction": "Is there any abnormality?",\n    "output": "No acute cardiopulmonary abnormality is seen."\n}]\n# ─── data flows into Step 3 & 4 ───→'},
       {n:2,title:'Image = Path',tag:'data',viz:'<span class="vz-box vz-input">📁 "xray_001.jpg"</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🖼️ Image.open()</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🖼️ Loaded Image</span>',code:'# "image" field = file path (same as fitz.open("pdf") in Phase 4)\n# Model loads it automatically during training\nfrom PIL import Image\nimg = Image.open(example["image"])  # Opens the file\n\n# Can be:\n#   Local: "chest_xray_001.jpg" (upload to Colab)\n#   URL: "https://example.com/scans/xray.png"\n# The training code handles loading — you just provide the path!'},
       {n:3,title:'Format as Text',tag:'sft',viz:'<span class="vz-box vz-input">📋 JSON</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔤 format_instruction()</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📄 One String</span>',code:'# 🔑 The image and text take TWO SEPARATE paths. They meet only at the LLM.\n\n# YOU write this JSON:\n# {\n#   "image": "chest_xray_001.jpg",\n#   "instruction": "What does this chest X-ray show?",\n#   "output": "Bilateral pneumonia in the right lower lobe."\n# }\n\n# ┌── PATH 1: Image ──────────────────────────────────┐\n# │ "chest_xray_001.jpg" → CLIP-ViT-L → [■ ■ ■ ... ■] │  197 visual tokens\n# └────────────────────────────────────────────────────┘\n#                                                      │\n# ┌── PATH 2: Text (Alpaca) ──────────────────────────┐│\n# │ format_instruction() turns JSON into this string:  ││\n# │ "Below is an instruction. Write a response.\\n\\n"   ││\n# │ "### Instruction:\\n"                               ││\n# │ "What does this chest X-ray show?\\n\\n"             ││\n# │ "### Response:\\n"                                  ││\n# │ "Bilateral pneumonia in the right lower lobe."     ││\n# │ → tokenizer → [1, 464, 8522, ...]                 ││  ~300 text tokens\n# └────────────────────────────────────────────────────┘│\n#                                                      │\n#              COMBINED before LLM:  ◄─────────────────┘\n#  [■][■][■]...[■] [1][464][8522]...[###][Resp]\n#   ← 197 visual →  ←──── ~300 text ────→\n#   The LLM sees ONE flat list of ~500 tokens. It does NOT know which is which.'},
       {n:4,title:'Tokenize',tag:'data',viz:'<span class="vz-box vz-input">🖼️📝 Image+Text</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔢 Vision Tokenizer</span><span class="vz-arrow">→</span><span class="vz-box vz-output">[img tokens, text tokens]</span>',code:'# Step 4: Tokenize → creates "dataset" variable used by TRAIN\n# 📥 Input: "data" from Step 1, via format_instruction() from Step 3\n# 📤 Output: "dataset" → passed to train_dataset=dataset in TRAIN Step 2\n\nfrom datasets import Dataset\n\ndataset = Dataset.from_list(data)              # Step 1\'s data\ndataset = dataset.map(format_instruction)       # Step 3\'s function\ndataset = dataset.map(tokenize, batched=True)   # Step 4: tokenize\n\n# ✅ "dataset" is ready! Used as: SFTTrainer(..., train_dataset=dataset, ...)\n#    ↑ This is the SAME "dataset" variable from TRAIN Step 2\n\n# Vision tokenizer + Text tokenizer work together\n# CLIP processes image → 197 visual tokens\n# Llama tokenizer processes text → ~300 text tokens (variable)\n# Combined: [visual_tokens] + [text_tokens] → model input\n\ndef tokenize(examples):\n    return tokenizer(\n        examples["text"],\n        truncation=True, padding="max_length", max_length=512\n    )\n# Vision tokens handled automatically by LLaVA processor'},
     ]},
    {emoji:'🧠',name:'TRAIN',time:'~5 min',desc:'LoRA → SFTTrainer',
     substeps:[
       {n:1,title:'Quantize + LoRA (LLaVA)',tag:'lora',viz:'<span class="vz-box vz-input">🧠 LLaVA-1.5-7B</span><span class="vz-arrow">→</span><span class="vz-box vz-process">⬇ 8-bit + LoRA(r=8)</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ 0.4% trainable</span>',code:'# LLaVA-1.5-7B = CLIP-ViT-L/14 (frozen, 304M) + Llama-7B (LoRA)\n# Same code as text FT! LoRA on the LLM part only.\nfrom transformers import BitsAndBytesConfig, AutoModelForCausalLM\nfrom peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training\nimport torch\n\nbnb_config = BitsAndBytesConfig(load_in_8bit=True)\nmodel = AutoModelForCausalLM.from_pretrained(\n    "llava-hf/llava-1.5-7b-hf",\n    quantization_config=bnb_config,\n    device_map="auto", torch_dtype=torch.float16\n)\nmodel = prepare_model_for_kbit_training(model)\nlora_config = LoraConfig(r=8, lora_alpha=16,\n    target_modules=["q_proj","v_proj"])\nmodel = get_peft_model(model, lora_config)\n# Vision encoder (CLIP-ViT-L): FROZEN. LLM (Llama-7B): LoRA on Q+V only.'},
       {n:2,title:'SFTTrainer',tag:'sft',viz:'<span class="vz-box vz-input">📋 Image+Q Pairs</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🎓 SFTTrainer (lr=2e-4)</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🤖 Medical VLM</span>',code:'# 📥 "dataset" comes from PREPROCESS Step 4 (tokenized Q&A pairs)\n# SAME SFTTrainer as text FT! Same 3 lines. Different data.\nfrom transformers import TrainingArguments\nfrom trl import SFTTrainer\n\ntraining_args = TrainingArguments(\n    output_dir="./medical_vlm_tuned",\n    num_train_epochs=3, per_device_train_batch_size=4,\n    learning_rate=2e-4, logging_steps=10,\n)\ntrainer = SFTTrainer(model=model, train_dataset=dataset,\n    formatting_func=format_instruction, args=training_args)\ntrainer.train()  # IDENTICAL to text FT pipeline!\n\n# 📤 Output: medical_vlm_tuned/adapter_model.safetensors (4MB)'},
       {n:3,title:'Vision Encoder',tag:'lora',viz:'<span class="vz-box vz-input">🖼️ Image</span><span class="vz-arrow">→</span><span class="vz-box vz-process">👁️ CLIP-ViT-L (304M)</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🔢 576 image tokens</span>',code:'# Runs INSIDE model.forward() during training. You never call this.\n# For each image in the batch:\n# 1. Load from disk (e.g., "chest_xray_001.jpg")\n# 2. Split into 14×14 patches = 196 + [CLS] = 197 total\n# 3. CLIP-ViT-L (304M, FROZEN) → 1024-dim per patch\n# 4. Project 1024→4096 → now each patch matches LLM input\n# Output: [197 tokens, each 4096-dim]\n# This encoder is FROZEN. Only the LLM gets LoRA on Q+V.'},
       {n:4,title:'LLM Decoder',tag:'sft',viz:'<span class="vz-box vz-input">🔢 Image tokens + 📝 Text</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🧠 Llama-7B / Mistral-7B</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 Medical answer</span>',code:'# Step 4: LLM Decoder — the MOMENT both streams combine\n# Inside model.forward(), ONE line of code:\n# combined = torch.cat([visual_tokens, text_tokens], dim=1)\n#           ← 197 tokens →  ← ~300 tokens →\n#           = ~500 total tokens, each 4096-dim\n\n# Then through 32 Transformer layers:\n# Layer 1: Q/K/V attention between ALL tokens (image+text)\n# Layer 2: ...\n# Layer 32: ...\n# LoRA on Q+V (0.4% trainable) adjusts behavior\n\n# Final: lm_head → predicts next word\n# The LLM has NO IDEA which tokens are image vs text.\n# It just sees ~500 vectors of 4096 numbers.'},
     ]},
    {emoji:'🚀',name:'DEPLOY',time:'~1 min',desc:'Save → HF Hub → Serve',
     substeps:[
       {n:1,title:'Save Adapter',tag:'lora',viz:'<span class="vz-box vz-input">🧠 Model</span><span class="vz-arrow">→</span><span class="vz-box vz-process">💾 save_pretrained()</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📁 adapter_model.safetensors (4MB)</span>',code:'# Save adapter (4MB) — same as text FT\nmodel.save_pretrained("./medical_vlm_adapter")\ntokenizer.save_pretrained("./medical_vlm_adapter")\n# 📁 Files: adapter_model.safetensors (4MB) + adapter_config.json (1KB)'},
       {n:2,title:'Push to HF Hub',tag:'lora',viz:'<span class="vz-box vz-input">📁 Local</span><span class="vz-arrow">→</span><span class="vz-box vz-process">☁️ push_to_hub()</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🌐 HF Hub</span>',code:'# Share your 4MB adapter on HuggingFace Hub\nfrom huggingface_hub import login\nlogin()  # Your HF token (one-time)\nmodel.push_to_hub("ashokmulchandani/medical-xray-vlm")\ntokenizer.push_to_hub("ashokmulchandani/medical-xray-vlm")\n# Anyone can download: AutoModel.from_pretrained("ashokmulchandani/medical-xray-vlm")'},

       {n:4,title:'Query',tag:'sft',viz:'<span class="vz-box vz-input">🖼️ New X-ray</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🤖 Medical VLM</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 "No acute finding."</span>',code:'# Query your Medical VLM with new X-rays\nfrom transformers import pipeline\npipe = pipeline("image-text-to-text", model=model, tokenizer=tokenizer)\nresult = pipe("chest_xray_002.jpg", "Is there any abnormality?")\n# → "No acute cardiopulmonary abnormality is seen."\n# Model sees the image AND reads the question — answers both together!'},

  stages:[
    {emoji:'📋',name:'PREPROCESS',time:'Feature Extraction',desc:'Vibration→Features→Text',
     substeps:[
       {n:1,title:'Raw Signal → Windows (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">📈 Sensor→MQTT→<br>pump_vibration.csv<br>10,000 rows/sec</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🪟 Sliding Window<br>1 sec = 10,000 rows</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📋 1 Window =<br>10,000 numbers</span>',code:'# DATA SOURCE: IoT accelerometer → MQTT → CSV/Parquet\n# File: pump_a_vibration_2025-07-27.csv\n# Columns: timestamp, accel_x, accel_y, accel_z, temp\n# 10 kHz = 10,000 rows per second per sensor\n\n# 📡 MQTT (Message Queue Telemetry Transport)\n# = Text messaging for machines. Sensor→MQTT Broker→CSV.\n# AWS IoT / Azure IoT Hub handles MQTT. You read the CSV.\n\nimport pandas as pd\ndf = pd.read_csv("pump_a_vibration_2025-07-27.csv")\n\n# Rolling window: split continuous stream into 1-sec chunks\nwindow_size = 10000  # 1 second at 10kHz\nfor i in range(0, len(df), window_size):\n    window = df.iloc[i : i+window_size]\n    # window = 10,000 rows × 4 columns (x,y,z,temp)\n\n# 🤖 DONE PROGRAMMATICALLY — Python script runs 24/7'},
       {n:2,title:'Extract Features (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">📋 1 Window<br>10,000 rows</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔢 scipy+numpy<br>12 formulas</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📊 features_2025-07-27.csv<br>1 row per second</span>',code:'# 🤖 DONE PROGRAMMATICALLY — Python script\n# Input: 10,000 numbers per window → Output: 12 features\n\nfrom scipy import stats\nimport numpy as np\n\ndef extract_features(window_1sec):\n    x = window_1sec["accel_x"].values\n    fft = np.fft.fft(x)\n    freqs = np.fft.fftfreq(len(x), 1/10000)\n    features = {\n        # TIME-DOMAIN (raw signal shape)\n        "kurtosis": stats.kurtosis(x),     # >3 = bearing fault!\n        "skewness": stats.skew(x),         # ≠0 = uneven wear\n        "rms": np.sqrt(np.mean(x**2)),     # overall vibration energy\n        "crest_factor": np.max(np.abs(x))/np.sqrt(np.mean(x**2)),\n        # FREQUENCY-DOMAIN (FFT → which part?)\n        "dominant_freq": freqs[np.argmax(np.abs(fft[:len(fft)//2]))],\n        "sideband_spacing": detect_sidebands(fft, freqs),\n    }\n    return features\n\n# 💾 OUTPUT FILE: features_2025-07-27.csv\n# 1 row per second, 12 feature columns\n# THIS FILE is used in Steps 3 and 4 below!\nfeatures_df.to_csv("features_2025-07-27.csv", index=False)'},
       {n:3,title:'Features → Natural Language (The Bridge!)',tag:'sft',viz:'<span class="vz-box vz-input">📊 Numbers Only<br>kurtosis: 8.2<br>rms: 4.2<br>crest: 5.3</span><span class="vz-arrow">→</span><span class="vz-box vz-process">✍️ f-string<br>fills blanks</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 English Sentence<br>"Machine Pump-A.<br>RMS:4.2. Kurtosis:8.2..."</span>',code:'# 🔑 THE BRIDGE: Numbers → English (LLMs read text, not numbers)\n# Think of it as a MAD LIBS game — fill numbers into a template\n\ndef features_to_text(f, machine_id, timestamp):\n    """Convert 12 numbers into 1 English sentence the LLM can read."""\n    return (\n        f"Machine {machine_id} at {timestamp}. "\n        f"RMS: {f[\'rms\']:.2f} mm/s (overall energy). "\n        f"Kurtosis: {f[\'kurtosis\']:.1f} (>3=impulsive fault). "\n        f"Crest Factor: {f[\'crest_factor\']:.1f} (peak severity). "\n        f"Skewness: {f[\'skewness\']:.1f} (≠0=asymmetric wear). "\n        f"Peak-to-Peak: {f[\'peak_to_peak\']:.2f} mm/s. "\n        f"Dominant Frequency: {f[\'dominant_freq\']:.0f} Hz. "\n        f"Dominant Amplitude: {f[\'dominant_amplitude\']:.2f}. "\n        f"Sideband Spacing: {f[\'sideband_spacing\']:.0f} Hz. "\n    )\n\n# 📥 INPUT: Reads features_2025-07-27.csv (from Step 2)\n# 📤 OUTPUT: One English sentence per row\n\n# BEFORE (LLM cannot understand):\n# {rms:4.2, kurtosis:8.2, crest_factor:5.3}\n\n# AFTER (LLM CAN understand):\n# "Machine Pump-A at 2025-07-27 14:30. RMS: 4.20 mm/s.\n#  Kurtosis: 8.2 (>3=impulsive). Crest Factor: 5.3..."\n# → LLM reads this like a diagnostic report and can reason about it!'},
       {n:4,title:'Create Q&A from Maintenance Logs (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">📝 Sensor Sentence<br>+<br>🔧 Work Order DB<br>(SAP/Oracle/Excel)</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔗 JOIN by<br>Timestamp+MachineID</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📋 instruction_data.json<br>(3000+ Q&A pairs)</span>',code:'# 🏷️ LABELS FROM: Maintenance work order system (SAP/Oracle/Excel)\n# "Pump-A bearing replaced on 2025-07-29 — inner race fault"\n\nmaintenance_log = pd.read_csv("work_orders_2025.csv")\n# Columns: machine_id, date, fault_type, action_taken, severity\n\n# Join: match sensor timestamp → nearest maintenance event\nfor _, sensor_row in features_df.iterrows():\n    match = maintenance_log[\n        (maintenance_log.machine_id == sensor_row.machine_id) &\n        (maintenance_log.date >= sensor_row.timestamp) &\n        (maintenance_log.date <= sensor_row.timestamp + timedelta(days=7))\n    ]\n    if len(match) > 0:\n        instruction_data.append({\n            "instruction": "Diagnose machine from vibration",\n            "input": features_to_text(sensor_row),\n            "output": f"{match.iloc[0].fault_type}. {match.iloc[0].action_taken}."\n        })\n\n# 📥 INPUT: features_2025-07-27.csv (from Step 2)\n# 📥 INPUT: work_orders_2025.csv (from maintenance system)\n# 📤 OUTPUT: instruction_data.json (Q&A pairs for SFT)\n\n# 🔧 Labels = real maintenance records, NOT manual labeling!'},
       {n:5,title:'Format as Alpaca (🤖 Automatic) — SAME as Text FT!',tag:'sft',viz:'<span class="vz-box vz-input">📋 instruction_data.json<br>3 fields per row</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔤 format_instruction()<br>SAME function!</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📄 One long string<br>with ### markers</span>',code:'# 🔑 JSON → Alpaca Training String (LLMs read ONE string)\n# EXACT SAME function as Text FT (Phase 5.3)!\ndef format_instruction(example):\n    text = "Below is an instruction. Write a response.\\n\\n"\n    text += "### Instruction:\\n" + example["instruction"] + "\\n\\n"\n    if example["input"]:  # Sensor data HAS input (the features-as-text)\n        text += "### Input:\\n" + example["input"] + "\\n\\n"\n    text += "### Response:\\n" + example["output"]\n    return {"text": text}\n\n# BEFORE (JSON):\n# {"instruction":"Diagnose machine...",\n#  "input":"Machine Pump-A. RMS:4.2. Kurtosis:8.2...",\n#  "output":"Bearing inner race fault. Replace bearing."}\n\n# AFTER (Alpaca String):\n# "Below is an instruction. Write a response.\n#  ### Instruction:\\nDiagnose machine from vibration\n#  ### Input:\\nMachine Pump-A. RMS:4.2. Kurtosis:8.2...\n#  ### Response:\\nBearing inner race fault. Replace bearing."\n\n# 🤖 This function is called by SFTTrainer for EVERY row!'},
       {n:'📖',title:'Feature→Fault Mapping',tag:'data',viz:'<span class="vz-box vz-input">🔢+⚙️ Specs</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📐 Physics</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🎯 Fault</span>',code:'# Domain knowledge from mechanical engineering:\n# Kurtosis>5+Crest>4→Bearing fault | RMS↑→Unbalance\n# 1×RPM→Unbalance | 2×RPM→Misalignment\n# Gear_mesh±sidebands→Gear wear'},
     ]},
    {emoji:'🧠',name:'TRAIN',time:'Same as Text',desc:'LoRA→SFTTrainer',
     substeps:[
       {n:1,title:'Quantize',tag:'lora',viz:'<span class="vz-box vz-input">🧠 FP16</span><span class="vz-arrow">→</span><span class="vz-box vz-process">⬇ 8-bit</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🧠 INT8</span>',code:'BitsAndBytesConfig(load_in_8bit=True)'},
       {n:2,title:'Apply LoRA',tag:'lora',viz:'<span class="vz-box vz-input">🔒 W₀</span><span class="vz-arrow">+</span><span class="vz-box vz-process">🆕 B×A</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ 0.4%</span>',code:'LoraConfig(r=8, target_modules=["q_proj","v_proj"])'},
       {n:3,title:'SFTTrainer',tag:'sft',viz:'<span class="vz-box vz-input">📋 Q&A</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🎓 SFTTrainer</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🤖 Model</span>',code:'trainer=SFTTrainer(model,dataset,formatting_func).train()\n# SAME 3 LINES as text FT'},
       {n:4,title:'Model Learns',tag:'sft',viz:'<span class="vz-box vz-input">📊 New Data</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🤖 LLM</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 Diagnosis</span>',code:'Model learns: kurtosis>5+crest>4=bearing fault in 48h'},

    {emoji:'🚀',name:'DEPLOY',time:'vLLM→API→Dashboard',desc:'Real-time diagnosis',

       {n:2,title:'Real-Time API',tag:'dpo',viz:'<span class="vz-box vz-input">📈 IoT Stream</span><span class="vz-arrow">→</span><span class="vz-box vz-process">⚡ vLLM API</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📝 Diagnosis</span>',code:'Every 1s: features→text→API→diagnosis'},
       {n:3,title:'Dashboard',tag:'sft',viz:'<span class="vz-box vz-input">📝 Diagnosis</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📊 Grafana</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📱 Alert</span>',code:'Grafana/Streamlit shows real-time trends + LLM diagnosis'},
       {n:4,title:'Monitor+Retrain',tag:'dpo',viz:'<span class="vz-box vz-input">📊 Live Data</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🔍 Drift?</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🔄 Retrain</span>',code:'Evidently AI→drift→auto-retrain on new machine types'},

{ // 7: LIDAR / POINT CLOUD
  name:'🛰️ LIDAR/Point Cloud FT', phases:'3D Perception & Autonomous Systems',
  metrics:[

  ],
  banner:[

    {val:'Same Code',lbl:'As Text FT',color:'var(--green)'},
    {val:'LIDAR/Depth',lbl:'Input Source',color:'var(--blue)'},
    {val:'Autonomous/Smart City',lbl:'Application',color:'var(--amber)'},
  ],
  stages:[
    {emoji:'📋',name:'PREPROCESS',time:'Point Cloud->Features->Text',desc:'Voxelize->Extract->Describe',
     substeps:[
       {n:1,title:'Load LIDAR Data (.pcd/.ply/.las) (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">🛰️ LIDAR Scanner<br>.las/.pcd<br>Millions of pts</span><span class="vz-arrow">-></span><span class="vz-box vz-process">📥 laspy/open3d<br>Load into GPU</span><span class="vz-arrow">-></span><span class="vz-box vz-output">☁️ Point Cloud<br>XYZ+Intensity</span>',code:'# DATA SOURCE: LIDAR scanner -> .las or .pcd file\n# File: urban_lidar_scan.las (DJI L1, ~400MB, 112M points)\n# Each point: X, Y, Z, Intensity, Classification, GPS time\n\nimport laspy\nimport numpy as np\n\nlas = laspy.read("urban_lidar_scan.las")\npoints = np.vstack([las.x, las.y, las.z, las.intensity]).T\n# points.shape = (112_000_000, 4) — 112 million points\n\n# 🤖 DONE PROGRAMMATICALLY'},
       {n:2,title:'Voxel Grid Downsampling + Throughput (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">☁️ 56 MB/sec<br>3.5M pts/sec</span><span class="vz-arrow">-></span><span class="vz-box vz-process">📦 Voxel Grid<br>0.5m cubes</span><span class="vz-arrow">-></span><span class="vz-box vz-output">☁️ 0.25 MB/sec<br>224x reduction!</span>',code:'# 🔑 REDUCE: 112M -> ~500K while keeping 3D structure\n# Each voxel (0.5m cube) keeps ONE representative point\n\nimport open3d as o3d\n\npcd = o3d.geometry.PointCloud()\npcd.points = o3d.utility.Vector3dVector(points[:, :3])\npcd_down = pcd.voxel_down_sample(voxel_size=0.5)\n# 112M -> ~500K points (224x reduction). Auto-done.\n\n# DATA THROUGHPUT — same concept as YOLO, different unit:\n# YOLO (Camera):  1920x1080x3 = 6.2M pixels x 60FPS = 373M px/sec\n# LIDAR (Pandar128): 3.5M points/sec x 16 bytes = 56 MB/sec raw\n#   After voxel downsampling: 15,600 pts/sec x 16 bytes = 0.25 MB/sec\n#   -> 224x reduction, then converted to text for LLM (~1KB/sec)'},
       {n:3,title:'Extract 3D Features (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">☁️ Downsampled Cloud</span><span class="vz-arrow">-></span><span class="vz-box vz-process">📐 Normals+Curvature<br>+Density+Height</span><span class="vz-arrow">-></span><span class="vz-box vz-output">📊 Feature Vector<br>per cluster</span>',code:'# 🤖 Extract meaningful 3D descriptors from each object cluster\n\ndef extract_3d_features(pcd):\n    pcd.estimate_normals(search_param=o3d.geometry.KDTreeSearchParamHybrid(radius=1.0))\n    labels = np.array(pcd.cluster_dbscan(eps=1.0, min_points=10))\n    features = []\n    for cluster_id in set(labels):\n        if cluster_id == -1: continue  # Skip noise\n        mask = labels == cluster_id\n        cluster_pts = np.asarray(pcd.points)[mask]\n        features.append({\n            "cluster_id": cluster_id,\n            "point_count": len(cluster_pts),\n            "height": cluster_pts[:,2].max()-cluster_pts[:,2].min(),\n            "footprint_area": compute_convex_hull_area(cluster_pts[:,:2]),\n            "verticality": compute_verticality(normals[mask]),\n        })\n    return features'},
       {n:'📖',title:'Throughput: YOLO vs Sensor vs LIDAR',tag:'data',viz:'<span class="vz-box vz-input">📸 YOLO (1 cam)<br>72 MB/sec</span><span class="vz-arrow">></span><span class="vz-box vz-input">🛰️ LIDAR<br>56 MB/sec</span><span class="vz-arrow">></span><span class="vz-box vz-input">🔧 Sensor<br>1 MB/sec</span>',code:'# SAME CONCEPT — different units:\n# 📸 YOLO (Camera):   640x640x3ch = 1.2M pixels/frame (resized from 1920x1080)\n#                      @ 60 FPS = 72M pixels/sec\n#                      1 byte (uint8) per pixel = 72 MB/sec\n#\n# 🔧 Sensor (IoT):    10,000 rows/sec from accelerometer\n#                      12 features per row = 120K values/sec\n#                      ~1 MB/sec after feature extraction\n#\n# 🛰️ LIDAR (Pandar128): 3.5M points/sec raw\n#                      4 floats x 4 bytes = 56 MB/sec raw\n#                      After voxel: 15,600 pts/sec = 0.25 MB/sec\n#                      After text conversion: ~1 KB/sec to LLM\n#\n# 💡 Single camera already > single LIDAR. Multi-camera (6-8)\n#    for autonomous driving = 400-600 MB/sec vs LIDAR 56 MB/sec\n#    But LIDAR gives DEPTH — cameras give TEXTURE. You need both.\n#\n# ALL converged to ~1 KB/sec text stream for the LLM!'},
       {n:4,title:'Features -> Natural Language (The Bridge!)',tag:'sft',viz:'<span class="vz-box vz-input">📊 Numbers Only<br>height:12.3m<br>area:45.2m2</span><span class="vz-arrow">-></span><span class="vz-box vz-process">✍️ f-string<br>fills template</span><span class="vz-arrow">-></span><span class="vz-box vz-output">📝 English Sentence</span>',code:'# 🔑 THE BRIDGE: 3D Numbers -> English (LLMs read text, not coords)\n# EXACT SAME PATTERN as Sensor/IoT FT!\n\ndef features_to_text(f, cluster_id, timestamp):\n    return (\n        f"Object cluster {cluster_id} at {timestamp}. "\n        f"Height: {f[\'height\']:.1f}m. "\n        f"Footprint: {f[\'footprint_area\']:.1f}m2. "\n        f"Points: {f[\'point_count\']}. "\n        f"Verticality: {f[\'verticality\']:.2f} (1.0=pole,0.0=ground). "\n    )\n\n# BEFORE (LLM cannot understand):\n# {cluster:3, height:12.3, area:45.2}\n\n# AFTER (LLM CAN understand):\n# "Object cluster 3. Height: 12.3m. Area: 45.2m2..."'},
       {n:5,title:'Create Q&A from Labeled Scenes (🤖 Automatic)',tag:'data',viz:'<span class="vz-box vz-input">📝 Scene Desc<br>+<br>🏷️ GIS Database<br>(Labels)</span><span class="vz-arrow">-></span><span class="vz-box vz-process">🔗 JOIN by<br>ClusterID</span><span class="vz-arrow">-></span><span class="vz-box vz-output">📋 instruction_data.json<br>(1000s of Q&A)</span>',code:'# 🏷️ LABELS FROM: GIS database or manual annotation\n# "Building #3 = Office tower, 12 floors, built 2018"\n\ngis_db = pd.read_csv("building_inventory.csv")\nfor _, row in features_df.iterrows():\n    match = gis_db[gis_db.cluster_id == row.cluster_id]\n    if len(match) > 0:\n        instruction_data.append({\n            "instruction": "Identify this LIDAR object",\n            "input": features_to_text(row),\n            "output": f"{match.iloc[0].building_type}. "\n                      f"{match.iloc[0].num_floors} floors."\n        })\n\n# 🔧 Labels = real GIS records, NOT manual labeling!'},
       {n:6,title:'Format as Alpaca (🤖 Automatic) — SAME as Text FT!',tag:'sft',viz:'<span class="vz-box vz-input">📋 instruction_data.json</span><span class="vz-arrow">-></span><span class="vz-box vz-process">🔤 format_instruction()<br>SAME function!</span><span class="vz-arrow">-></span><span class="vz-box vz-output">📄 Alpaca String</span>',code:'# 🔑 EXACT SAME function as Text FT, Tabular FT, Sensor FT!\ndef format_instruction(example):\n    text = "Below is an instruction. Write a response.\\n\\n"\n    text += "### Instruction:\\n" + example["instruction"] + "\\n\\n"\n    if example["input"]:  # LIDAR data HAS input (features-as-text)\n        text += "### Input:\\n" + example["input"] + "\\n\\n"\n    text += "### Response:\\n" + example["output"]\n    return {"text": text}\n\n# Same pattern. Same function. Different data modality.'},
     ]},
    {emoji:'🧠',name:'TRAIN',time:'Same as Text',desc:'LoRA->SFTTrainer',

       {n:2,title:'Apply LoRA',tag:'lora',viz:'<span class="vz-box vz-input">🔒 W₀</span><span class="vz-arrow">+</span><span class="vz-box vz-process">🆕 B×A</span><span class="vz-arrow">-></span><span class="vz-box vz-output">✅ 0.4%</span>',code:'LoraConfig(r=8, target_modules=["q_proj","v_proj"])'},

       {n:4,title:'Model Learns 3D Scene Understanding',tag:'sft',viz:'<span class="vz-box vz-input">☁️ New Scenes</span><span class="vz-arrow">-></span><span class="vz-box vz-process">🤖 LLM</span><span class="vz-arrow">-></span><span class="vz-box vz-output">🏗️ 3D Description</span>',code:'Model learns:\n- height>10m+vert>0.8+area>20m2 = multistory building\n- height<3m+area>50m2+vert<0.2 = flat ground/parking\n- height>2m+vert>0.9+pts<100 = street light/pole'},

       {n:2,title:'TensorRT / vLLM Deploy',tag:'dpo',viz:'<span class="vz-box vz-input">☁️ LIDAR Stream</span><span class="vz-arrow">-></span><span class="vz-box vz-process">⚡ TensorRT/vLLM</span><span class="vz-arrow">-></span><span class="vz-box vz-output">📝 3D Labels</span>',code:'# Two deployment paths:\n# 1. PointNet + TensorRT -> real-time 3D detection\n# 2. vLLM API -> text-based scene descriptions\n# Both: merge_and_unload() adapter first (Phase 3.10 rule)'},

// ── RENDER ──
let currentTab=0, currentStage=0;

function switchTab(i){
  currentTab=i; currentStage=0;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  render();
}

function render(){
  const t=tabs[currentTab];

  let html=`
    <div class="pipeline-card">
      <div class="pipeline-label">${t.name} — ${t.phases}</div>

      <div class="perf-banner">
        ${t.banner.map((b,i)=>`
          ${i>0?'<div class="perf-divider"></div>':''}
          <div class="perf-item"><div class="pv" style="color:${b.color};">${b.val}</div><div class="pl">${b.lbl}</div></div>
        `).join('')}
      </div>

      <div class="metrics">${t.metrics.map(m=>`
        <div class="metric"><div class="val" style="color:${m.color};">${m.val}</div><div class="lbl">${m.lbl}</div></div>
      `).join('')}</div>

      <div class="pipeline">`;

  if(t.stages){
    t.stages.forEach((s,i)=>{
      const active=i===currentStage?' active-stage':'';
      html+=`
        <div class="pipe-stage${active}" onclick="selectStage(${i})">
          <div class="st-emoji">${s.emoji}</div>
          <div class="st-name">${s.name}</div>
          <div class="st-time">${s.time}</div>
          <div class="st-desc">${s.desc}</div>
        </div>`;
      if(i<t.stages.length-1) html+='<div class="pipe-arrow">→</div>';
    });
  }

  // For lifecycle tab, only 3 stages (no RUN/MONITOR as separate stages since they're in DEPLOY)
  html+=`</div>`;

  // Substeps
  if(t.stages&&t.stages[currentStage]){
    const s=t.stages[currentStage];
    html+=`
      <div class="substeps show">
        <h4>${s.emoji} ${s.name} — Sub-Operations (${s.time})</h4>
        <div class="substep-grid">
          ${s.substeps.map(ss=>`
            <div class="substep">
              <span class="ss-num">Step ${ss.n}</span>
              <div class="ss-title">${ss.title}</div>
              ${ss.viz?`<div class="ss-viz">${ss.viz}</div>`:''}
              <div class="ss-code">${ss.code}</div>
              <span class="ss-tag ${ss.tag==='lora'?'lora':ss.tag==='sft'?'sft':'dpo'}">${ss.tag==='lora'?'LoRA/Quant':ss.tag==='sft'?'SFT':'DPO/Deploy'}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  html+=`
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="selectStage(${currentStage-1})" ${currentStage===0?'disabled':''}>◀ Prev</button>
      <span style="font-size:0.65rem;color:var(--tmut);">Stage ${currentStage+1} / ${t.stages?t.stages.length:1}</span>
      <button class="nav-btn" onclick="selectStage(${currentStage+1})" ${!t.stages||currentStage===t.stages.length-1?'disabled':''}>Next ▶</button>
      <button class="nav-btn" onclick="selectStage(0)">↺ Reset</button>
    </div>`;

  document.getElementById('app').innerHTML=html;

  // Comparison
  document.getElementById('comparison').innerHTML=`
    <h3>📊 All 4 Data Types — Side by Side</h3>
    <div style="overflow-x:auto;">
    <table class="tbl">
    <thead><tr><th></th><th>📝 Text</th><th>📊 Tabular</th><th>🖼️ Image</th><th>🖼️📝 Vision-Lang</th></tr></thead>
    <tbody>
    <tr><td>Input</td><td>Q&A text</td><td>Rows → sentences</td><td>Images + labels</td><td>Images + questions</td></tr>
    <tr><td>Model</td><td>TinyLlama-1.1B, Llama-7B, Mistral-7B</td><td>TinyLlama-1.1B, Llama-7B, Mistral-7B</td><td>YOLOv8n, ResNet-50, ViT</td><td>LLaVA-1.5-7B, GPT-4V, Qwen-VL</td></tr>
    <tr><td>LoRA?</td><td class="yes">✅ Yes</td><td class="yes">✅ Yes</td><td class="no">⚠️ Not standard</td><td class="yes">✅ Yes</td></tr>
    <tr><td>Training</td><td>SFT + DPO</td><td>SFT</td><td>Transfer Learning</td><td>SFT + DPO</td></tr>
    <tr><td>Phase</td><td>4–6</td><td>Now</td><td>10</td><td>10</td></tr>
    </tbody></table></div>
    <div class="callout" style="margin-top:0.75rem;"><strong>🧠 Pre-trained model → freeze → adapter → train on YOUR data.</strong> Tools change with data type. Pattern never changes.</div>

<h3 style="margin-top:1.5rem;">🔓 Model Licensing — Are They Free?</h3>
<div style="overflow-x:auto;">
<table class="tbl">
<thead><tr><th>Model</th><th>License</th><th>Free?</th><th>Commercial Use?</th><th>The Catch</th></tr></thead>
<tbody>
<tr style="background:rgba(26,110,52,0.04);"><td><strong>TinyLlama-1.1B</strong></td><td>Apache 2.0</td><td class="yes">✅ Free</td><td class="yes">✅ Yes</td><td style="font-size:0.62rem;">None — fully open. Deploy anywhere.</td></tr>
<tr style="background:rgba(26,110,52,0.04);"><td><strong>ResNet-50</strong></td><td>Apache 2.0 / MIT</td><td class="yes">✅ Free</td><td class="yes">✅ Yes</td><td style="font-size:0.62rem;">None — classic CV backbone, no restrictions.</td></tr>
<tr style="background:rgba(26,110,52,0.04);"><td><strong>LLaVA-1.5</strong></td><td>Apache 2.0</td><td class="yes">✅ Free</td><td class="yes">✅ Yes</td><td style="font-size:0.62rem;">None — run locally via vLLM or Ollama.</td></tr>
<tr style="background:rgba(184,112,0,0.04);"><td><strong>Llama-7B / 70B</strong></td><td>Meta Llama Community</td><td class="yes">✅ Free</td><td style="color:var(--amber);">⚠️ Conditional</td><td style="font-size:0.62rem;">>700M MAU requires custom license from Meta.</td></tr>
<tr style="background:rgba(184,112,0,0.04);"><td><strong>Mistral-7B</strong></td><td>Apache 2.0</td><td class="yes">✅ Free</td><td class="yes">✅ Yes</td><td style="font-size:0.62rem;">None — Apache 2.0, fully permissive.</td></tr>
<tr style="background:rgba(184,112,0,0.04);"><td><strong>YOLOv8n</strong></td><td>AGPL-3.0</td><td class="yes">✅ Free</td><td style="color:var(--amber);">⚠️ Copyleft</td><td style="font-size:0.62rem;">SaaS/API use → must open-source your code OR buy Enterprise license.</td></tr>
<tr style="background:rgba(198,40,40,0.04);"><td><strong>GPT-4V</strong></td><td>Proprietary</td><td class="no">❌ Paid API</td><td class="no">❌ API only</td><td style="font-size:0.62rem;">Cannot download. Cannot run locally. Billed per token.</td></tr>
<tr style="background:rgba(198,40,40,0.04);"><td><strong>Qwen-VL</strong></td><td>Apache 2.0 (Qwen License)</td><td class="yes">✅ Free</td><td class="yes">✅ Yes</td><td style="font-size:0.62rem;">Free for <100M MAU. Over 100M needs Alibaba approval.</td></tr>
</tbody></table>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin:0.75rem 0;font-size:0.65rem;text-align:center;">
  <div style="background:rgba(26,110,52,0.06);border:1px solid rgba(26,110,52,0.2);border-radius:8px;padding:0.5rem;"><strong style="color:var(--green);">🟢 Truly Open Source</strong><br>TinyLlama, ResNet, LLaVA, Mistral<br><span style="color:var(--tmut);">Apache 2.0 / MIT — No restrictions</span></div>
  <div style="background:rgba(184,112,0,0.06);border:1px solid rgba(184,112,0,0.2);border-radius:8px;padding:0.5rem;"><strong style="color:var(--amber);">🟡 Open-Weights (Catches)</strong><br>Llama, YOLOv8, Qwen-VL<br><span style="color:var(--tmut);">Free to use, commercial has limits</span></div>
  <div style="background:rgba(198,40,40,0.06);border:1px solid rgba(198,40,40,0.2);border-radius:8px;padding:0.5rem;"><strong style="color:var(--red);">🔴 Proprietary (Paid)</strong><br>GPT-4V<br><span style="color:var(--tmut);">API only, billed per token</span></div>
</div>`;
}

function selectStage(i){
  const t=tabs[currentTab];
  if(!t.stages||i<0||i>=t.stages.length) return;
  currentStage=i; render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') selectStage(currentStage+1);
  if(e.key==='ArrowLeft') selectStage(currentStage-1);
});

render();
</script>
</body>
</html>
