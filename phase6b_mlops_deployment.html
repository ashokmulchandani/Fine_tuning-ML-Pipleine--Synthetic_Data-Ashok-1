<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 6B: MLOps Pipeline — Visual Explainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fc;--card:#fff;--raised:#eef0f5;--border:#dde0e6;--text:#1a1d23;--tdim:#4a4f5b;--tmut:#8b909b;--violet:#5b3aa8;--vbg:#f3effc;--cyan:#007a99;--cyan-bg:#e6f4f7;--amber:#b87000;--amber-bg:#fff6e5;--green:#1a6e34;--green-bg:#e6f4ea;--red:#c62828;--red-bg:#ffebe9;--magenta:#9e2a6b;--magenta-bg:#fdf0f7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh}
.app{max-width:1000px;margin:0 auto;padding:1.5rem}
.header{text-align:center;padding:1.5rem 0 0.5rem}
.header .title-row{display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:0.3rem}
.header .mega-emoji{font-size:2rem}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;color:var(--violet)}
.header .subtitle{color:var(--tdim);font-size:0.8rem}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:0.4rem;justify-content:center;margin:1rem 0}
.tab{font-family:'Space Grotesk',sans-serif;font-size:0.62rem;font-weight:600;letter-spacing:0.04em;padding:0.5em 1em;border-radius:100px;border:1.5px solid var(--border);background:var(--card);color:var(--tdim);cursor:pointer;transition:0.2s}
.tab:hover{border-color:var(--violet);color:var(--violet)}
.tab.active{border-color:var(--violet);color:var(--violet);background:var(--vbg)}
.tab .tb-emoji{font-size:0.9rem}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0.5rem;margin:0.75rem 0}
.metric{text-align:center;padding:0.5rem}
.metric .val{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700}
.metric .lbl{font-size:0.58rem;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em;margin-top:0.15rem}

/* Perf banner */
.perf-banner{display:flex;align-items:center;justify-content:center;gap:0.75rem;padding:0.75rem 1.5rem;background:var(--card);border:1px solid var(--border);border-radius:12px;margin:0.75rem 0;flex-wrap:wrap}
.perf-item{text-align:center}
.perf-item .pv{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700}
.perf-item .pl{font-size:0.55rem;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em}
.perf-divider{width:1px;height:30px;background:var(--border)}

/* Pipeline card */
.pipeline-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin:0.75rem 0}
.pipeline-label{font-family:'Space Grotesk',sans-serif;font-size:0.75rem;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;text-align:center}

/* Pipeline stages */
.pipeline{display:flex;align-items:center;gap:0.3rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.pipe-stage{background:var(--raised);border:2px solid var(--border);border-radius:10px;padding:0.6rem 0.8rem;text-align:center;cursor:pointer;transition:0.2s;min-width:100px}
.pipe-stage:hover{border-color:var(--violet)}
.pipe-stage.active-stage{border-color:var(--violet);background:var(--vbg)}
.pipe-stage .st-emoji{font-size:1.3rem;display:block;margin-bottom:0.1rem}
.pipe-stage .st-name{font-family:'Space Grotesk',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.06em;color:var(--text)}
.pipe-stage .st-time{font-size:0.5rem;color:var(--tmut);margin-top:0.1rem}
.pipe-stage .st-desc{font-size:0.5rem;color:var(--tdim);margin-top:0.1rem}
.pipe-arrow{font-size:1rem;color:var(--violet)}

/* Substeps */
.substeps{margin-top:1rem}
.substeps h4{font-family:'Space Grotesk',sans-serif;font-size:0.7rem;color:var(--violet);margin-bottom:0.6rem}
.substep-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.substep{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:0.7rem 0.9rem}
.substep .ss-num{font-family:'Space Grotesk',sans-serif;font-size:0.52rem;font-weight:700;color:var(--violet);background:var(--vbg);padding:0.15em 0.5em;border-radius:4px;display:inline-block;margin-bottom:0.3rem}
.substep .ss-title{font-family:'Space Grotesk',sans-serif;font-size:0.65rem;font-weight:600;margin-bottom:0.3rem}
.substep .ss-code{background:#1e1e1e;border-radius:6px;padding:0.5rem 0.7rem;margin:0.4rem 0;font-family:'Space Grotesk',monospace;font-size:0.58rem;line-height:1.7;color:#d4d4d4;white-space:pre-wrap;overflow-x:auto}
.substep .ss-viz{display:flex;align-items:center;gap:0.3rem;margin:0.4rem 0;font-size:0.65rem;flex-wrap:wrap}
.ss-viz .vz-box{background:var(--card);border:1.5px solid var(--border);border-radius:6px;padding:0.25rem 0.5rem;font-weight:600;font-family:'Space Grotesk',sans-serif;font-size:0.55rem;display:flex;align-items:center;gap:0.2rem}
.ss-viz .vz-arrow{color:var(--violet);font-weight:700}
.ss-viz .vz-input{border-color:var(--amber);background:var(--amber-bg)}
.ss-viz .vz-process{border-color:var(--violet);background:var(--vbg)}
.ss-viz .vz-output{border-color:var(--green);background:var(--green-bg)}
.ss-tag{display:inline-block;font-size:0.5rem;padding:1px 6px;border-radius:100px;margin-top:0.3rem}
.ss-tag.mlflow{background:var(--vbg);color:var(--violet)}
.ss-tag.dvc{background:var(--amber-bg);color:var(--amber)}
.ss-tag.evidently{background:var(--green-bg);color:var(--green)}
.ss-tag.vllm{background:var(--magenta-bg);color:var(--magenta)}
.ss-tag.ci{background:var(--cyan-bg);color:var(--cyan)}

/* Nav */
.nav-row{display:flex;justify-content:center;align-items:center;gap:0.75rem;margin:1.25rem 0}
.nav-btn{font-family:'Space Grotesk',sans-serif;font-size:0.65rem;font-weight:600;padding:0.45em 1.2em;border:2px solid var(--border);border-radius:100px;background:var(--card);color:var(--text);cursor:pointer;transition:0.15s}
.nav-btn:hover{border-color:var(--violet);color:var(--violet)}
.nav-btn:disabled{opacity:0.25;cursor:not-allowed}

.callout{background:var(--vbg);border:1px solid rgba(91,58,168,0.15);border-radius:10px;padding:0.6rem 1rem;margin:0.75rem 0;font-size:0.78rem;text-align:center}

@media(max-width:768px){.pipeline{flex-direction:column;align-items:center}.pipe-arrow{transform:rotate(90deg)}.substep-grid{grid-template-columns:1fr}.perf-banner{gap:0.5rem}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="title-row"><span class="mega-emoji">🔧</span><h1>MLOps Pipeline Visualizer</h1></div>
  <p class="subtitle">Click any stage, then step through its sub-operations. Track (MLflow) → Version (DVC) → Monitor (Evidently) → Deploy (vLLM)</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab(0)"><span class="tb-emoji">🔬</span> MLflow Tracking</button>
  <button class="tab" onclick="switchTab(1)"><span class="tb-emoji">📦</span> DVC Versioning</button>
  <button class="tab" onclick="switchTab(2)"><span class="tb-emoji">📈</span> Evidently Drift</button>
  <button class="tab" onclick="switchTab(3)"><span class="tb-emoji">🚀</span> vLLM Deploy</button>
  <button class="tab" onclick="switchTab(4)"><span class="tb-emoji">⚙️</span> CI/CD Pipeline</button>
  <button class="tab" onclick="switchTab(5)"><span class="tb-emoji">💰</span> Cost Compare</button>
</div>

<div class="perf-banner">
  <div class="perf-item"><div class="pv" style="color:var(--violet);">8 runs</div><div class="pl">MLflow Experiments</div></div>
  <div class="perf-divider"></div>
  <div class="perf-item"><div class="pv" style="color:var(--amber);">5 versions</div><div class="pl">DVC Data Snapshots</div></div>
  <div class="perf-divider"></div>
  <div class="perf-item"><div class="pv" style="color:var(--green);">Daily</div><div class="pl">Drift Monitor</div></div>
  <div class="perf-divider"></div>
  <div class="perf-item"><div class="pv" style="color:var(--cyan);">$387/mo</div><div class="pl">Serve Cost (T4)</div></div>
</div>

<div id="pipelineCard"></div>

<div class="nav-row">
  <button class="nav-btn" id="prevBtn" onclick="selectStage(currentStage-1)">◀ Prev</button>
  <span style="font-size:0.65rem;color:var(--tmut);" id="stageLabel">Stage 1 / 3</span>
  <button class="nav-btn" id="nextBtn" onclick="selectStage(currentStage+1)">Next ▶</button>
  <button class="nav-btn" onclick="selectStage(0)">↺ Reset</button>
</div>
</div>

<script>
const tabs=[
{ // 0: MLflow Tracking
  name:'🔬 MLflow — Experiment Tracking', phases:'Log Every Training Run',
  metrics:[
    {val:'Params',lbl:'lora_r, lr, epochs',color:'var(--violet)'},
    {val:'Metrics',lbl:'loss, accuracy',color:'var(--green)'},
    {val:'Artifacts',lbl:'adapter.safetensors',color:'var(--amber)'},
    {val:'Registry',lbl:'Staging→Production',color:'var(--cyan)'},
  ],
  banner:[
    {val:'TrackRun()',lbl:'Context Manager',color:'var(--violet)'},
    {val:'2 Lines',lbl:'To Log Everything',color:'var(--green)'},
    {val:'$0',lbl:'Open Source',color:'var(--amber)'},
    {val:'mlflow ui',lbl:'Dashboard',color:'var(--cyan)'},
  ],
  stages:[
    {emoji:'📋',name:'PREPROCESS',time:'Setup',desc:'Install + Start UI',
     substeps:[
       {n:1,title:'Install MLflow (🤖 Automatic)',tag:'mlflow',viz:'<span class="vz-box vz-input">pip install</span><span class="vz-arrow">→</span><span class="vz-box vz-output">mlflow ready</span>',code:'pip install mlflow'},
       {n:2,title:'Start Tracking UI (Terminal 1)',tag:'mlflow',viz:'<span class="vz-box vz-input">mlflow ui</span><span class="vz-arrow">→</span><span class="vz-box vz-output">localhost:5000</span>',code:'# Terminal 1 — leave this running\nmlflow ui --backend-store-uri sqlite:///mlruns.db\n\n# Opens http://localhost:5000\n# Shows: Experiments, Runs, Compare, Registry'},
       {n:3,title:'Write the hands-on script',tag:'mlflow',viz:'<span class="vz-box vz-input">TrackRun()</span><span class="vz-arrow">→</span><span class="vz-box vz-process">with ctx</span><span class="vz-arrow">→</span><span class="vz-box vz-output">auto-log</span>',code:'# scripts/hands_on_stage1_mlflow.py\nfrom scripts.mlflow_tracking import TrackRun\n\nwith TrackRun("hands-on-test", {"lora_r": 8, "lr": 2e-4}) as run:\n    # Your training code here\n    run.log_metric("final_loss", 0.65)\n\n# On exit → auto-logs:\n# - Start time + duration\n# - Python version + GPU info\n# - All params + metrics + artifacts'},
     ]},
    {emoji:'🧠',name:'TRAIN',time:'~3 min',desc:'Run Script → See Results',
     substeps:[
       {n:1,title:'Run the tracking script (Terminal 2)',tag:'mlflow',viz:'<span class="vz-box vz-input">python -m</span><span class="vz-arrow">→</span><span class="vz-box vz-process">TrackRun</span><span class="vz-arrow">→</span><span class="vz-box vz-output">mlruns.db</span>',code:'# Terminal 2 — run the hands-on script\ncd c:\\Users\\ashok\\OneDrive\\NOblox\\Fine_tuning-ML-Pipleine--Synthetic_Data-Ashok-1\npython -m scripts.hands_on_stage1_mlflow\n\n# Output:\n# [MLflow] Experiment: hands-on-test\n# [MLflow] Run: a1b2c3d4...\n# [MLflow] Params: {"lora_r": 8, "lr": 2e-4}\n# [MLflow] Training completed in 0m 3s\n# [MLflow] View results: mlflow ui'},
       {n:2,title:'What MLflow Records (per run)',tag:'mlflow',viz:'<span class="vz-box vz-input">▶️ Start</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📝 Params</span><span class="vz-arrow">→</span><span class="vz-box vz-process">🏋️ Train</span><span class="vz-arrow">→</span><span class="vz-box vz-output">💾 Artifact</span>',code:'# Each run captures:\n# PARAMETERS: lora_r=8, lr=2e-4, epochs=3, python_version=3.12\n# METRICS: loss (2.0→1.0→0.67 per step), final_loss=0.65\n# DURATION: 4.2s (auto-logged on context exit)\n# ARTIFACTS: adapter_model.safetensors (if log_adapter() called)\n# SOURCE: Which script produced this run\n# STATUS: Finished / Failed\n# All stored in mlruns.db (single SQLite file)'},
       {n:3,title:'View in Dashboard (Browser)',tag:'mlflow',viz:'<span class="vz-box vz-input">localhost:5000</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Click Run</span><span class="vz-arrow">→</span><span class="vz-box vz-output">All Details</span>',code:'# Open http://localhost:5000 → see:\n#  Experiment "hands-on-test" — 1 run\n#  Click the run → Overview tab:\n#    - Parameters: lora_r=8, lr=2e-4\n#    - Metrics: loss chart (3 steps), final_loss=0.65\n#    - Artifacts: adapter/ directory\n#    - Duration: 4.2s\n#    - Source: hands_on_stage1_mlflow.py\n#  Compare tab → select multiple runs → side-by-side'},
     ]},
    {emoji:'🚀',name:'POST PROCESS',time:'Registry',desc:'Model Registry + Promote',
     substeps:[
       {n:1,title:'Register Model (after real training)',tag:'mlflow',viz:'<span class="vz-box vz-input">run.log_adapter()</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Registry</span><span class="vz-arrow">→</span><span class="vz-box vz-output">v1 (None)</span>',code:'# Inside TrackRun context:\nrun.log_adapter("./adapter")\n\n# MLflow:\n# 1. Logs adapter files as artifacts\n# 2. Registers model "instruction-ft-medical" v1\n# 3. Stage: None (not yet reviewed)'},
       {n:2,title:'Promote: None → Staging → Production',tag:'mlflow',viz:'<span class="vz-box vz-input">v1 None</span><span class="vz-arrow">→</span><span class="vz-box vz-process">v1 Staging</span><span class="vz-arrow">→</span><span class="vz-box vz-output">v1 Production</span>',code:'# Human reviews model in Staging → promotes to Production\nmlflow models transition instruction-ft-medical 1 --stage Staging\nmlflow models transition instruction-ft-medical 1 --stage Production\n\n# Rollback (emergency):\nmlflow models transition instruction-ft-medical 0 --stage Production'},
       {n:3,title:'What MLflow stores vs HuggingFace',tag:'mlflow',viz:'<span class="vz-box vz-input">MLflow</span><span class="vz-arrow">vs</span><span class="vz-box vz-output">HF Hub</span>',code:'# MLflow (internal team):\n#   - Private to your team\n#   - Full experiment history\n#   - Model Registry (Staging→Production)\n#   - Adapter + config + tokenizer stored\n#   - Free (open source)\n\n# HuggingFace Hub (public):\n#   - Share with the world\n#   - Model cards only (no experiment tracking)\n#   - No staging workflow\n#   - Free for public, paid for private'},
     ]},
  ]
},
{ // 1: DVC Versioning
  name:'📦 DVC — Data Versioning', phases:'Track Which Dataset Produced Which Model',
  metrics:[
    {val:'dvc add',lbl:'Track Data Files',color:'var(--amber)'},
    {val:'dvc.yaml',lbl:'Pipeline Definition',color:'var(--violet)'},
    {val:'dvc repro',lbl:'Reproduce Pipeline',color:'var(--green)'},
    {val:'S3/GDrive',lbl:'Remote Storage',color:'var(--cyan)'},
  ],
  banner:[
    {val:'Hash-based',lbl:'Cache (not timestamps)',color:'var(--amber)'},
    {val:'200 bytes',lbl:'Git Pointer Size',color:'var(--green)'},
    {val:'3 Stages',lbl:'prepare→train→eval',color:'var(--violet)'},
    {val:'$0',lbl:'Open Source',color:'var(--cyan)'},
  ],
  stages:[
    {emoji:'📋',name:'PREPROCESS',time:'Setup',desc:'Init DVC + Track Data',
     substeps:[
       {n:1,title:'Install & Initialize DVC',tag:'dvc',viz:'<span class="vz-box vz-input">pip install</span><span class="vz-arrow">→</span><span class="vz-box vz-process">dvc init</span><span class="vz-arrow">→</span><span class="vz-box vz-output">.dvc/ created</span>',code:'# Install and initialize\npip install dvc\ncd c:\\Users\\ashok\\OneDrive\\NOblox\\Fine_tuning-ML-Pipleine--Synthetic_Data-Ashok-1\ndvc init\n\n# Creates .dvc/ directory — DVC is now tracking this project\n# Creates .dvcignore — files DVC should ignore'},
       {n:2,title:'Track your training data',tag:'dvc',viz:'<span class="vz-box vz-input">data/*.csv</span><span class="vz-arrow">→</span><span class="vz-box vz-process">dvc add</span><span class="vz-arrow">→</span><span class="vz-box vz-output">.dvc pointer</span>',code:'# Track data with DVC\ncd c:\\Users\\ashok\\OneDrive\\NOblox\\Fine_tuning-ML-Pipleine--Synthetic_Data-Ashok-1\ndvc add data/instruction_data.csv\n\n# What happens:\n# 1. DVC hashes the file (MD5)\n# 2. Copies file to .dvc/cache\n# 3. Creates data/instruction_data.csv.dvc (200-byte pointer)\n# 4. Git tracks only the .dvc pointer — NOT the 5MB CSV\n\n# Push data to remote (S3/GDrive):\ndvc remote add -d myremote gdrive://your-folder-id\ndvc push'},
       {n:3,title:'Git commits the pointer, DVC stores data',tag:'dvc',viz:'<span class="vz-box vz-input">Git</span><span class="vz-arrow">→</span><span class="vz-box vz-process">.dvc file (200B)</span><span class="vz-arrow">+</span><span class="vz-box vz-input">DVC</span><span class="vz-arrow">→</span><span class="vz-box vz-output">data (5MB)</span>',code:'# Git: tracks the small .dvc pointer file\ngit add data/instruction_data.csv.dvc\ngit commit -m "Add Q&A dataset v2 — 500 rows"\n\n# DVC: stores the actual 5MB CSV in cache/remote\ndvc push\n\n# Anyone can reproduce:\n#   git checkout <commit>    # Get the pointer\n#   dvc checkout              # Restore exact data version'},
     ]},
    {emoji:'🧠',name:'TRAIN',time:'Pipeline',desc:'Define & Run DVC Pipeline',
     substeps:[
       {n:1,title:'Define the 3-stage pipeline (dvc.yaml)',tag:'dvc',viz:'<span class="vz-box vz-input">dvc.yaml</span><span class="vz-arrow">→</span><span class="vz-box vz-process">3 stages</span><span class="vz-arrow">→</span><span class="vz-box vz-output">Cached DAG</span>',code:'# dvc.yaml — the entire pipeline in one file\nstages:\n  prepare_data:\n    cmd: python scripts/prepare_data.py\n    deps: [data/instruction_data.csv]\n    outs: [data/train_split.csv, data/val_split.csv]\n  train:\n    cmd: python scripts/train_stage.py\n    deps: [data/train_split.csv, scripts/train_stage.py]\n    outs: [models/adapter_model.safetensors]\n  evaluate:\n    cmd: python scripts/evaluate_stage.py\n    deps: [models/adapter_model.safetensors, data/val_split.csv]\n    metrics: [metrics/evaluation_metrics.json]'},
       {n:2,title:'dvc repro — One command, full pipeline',tag:'dvc',viz:'<span class="vz-box vz-input">dvc repro</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Walk DAG</span><span class="vz-arrow">→</span><span class="vz-box vz-output">Run or Skip</span>',code:'# Run the full pipeline — one command\ncd c:\\Users\\ashok\\OneDrive\\NOblox\\Fine_tuning-ML-Pipleine--Synthetic_Data-Ashok-1\ndvc repro\n\n# If nothing changed → all 3 stages CACHED (skipped)\n# If data changed → prepare_data re-runs → train re-runs → evaluate re-runs\n# If only evaluate script changed → only evaluate re-runs\n\n# Dry-run (see what would run):\ndvc repro --dry'},
       {n:3,title:'params.yaml — All hyperparameters tracked',tag:'dvc',viz:'<span class="vz-box vz-input">params.yaml</span><span class="vz-arrow">→</span><span class="vz-box vz-process">dvc repro</span><span class="vz-arrow">→</span><span class="vz-box vz-output">Reproducible</span>',code:'# params.yaml — single source of truth for all hyperparams\ntrain:\n  base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0\n  lora_r: 8\n  lora_alpha: 16\n  learning_rate: 2e-4\n  epochs: 10\n  batch_size: 4\n\n# Experiment: dvc experiments run --set-param train.lora_r=16\n# DVC tracks which params produced which results'},
     ]},
    {emoji:'🚀',name:'POST PROCESS',time:'Version',desc:'Checkout + Reproduce',
     substeps:[
       {n:1,title:'Reproduce any past experiment',tag:'dvc',viz:'<span class="vz-box vz-input">git checkout</span><span class="vz-arrow">+</span><span class="vz-box vz-input">dvc checkout</span><span class="vz-arrow">→</span><span class="vz-box vz-output">Exact state</span>',code:'# Reproduce a model from 3 months ago:\ngit checkout <commit>       # Get the exact code\ndvc checkout                  # Get the exact dataset\ndvc repro train               # Re-run training\n# Produces the EXACT same adapter\n\n# Answer: "Which data was run #7 trained on?"\n# MLflow run #7 → recorded git commit → dvc checkout that commit'},
       {n:2,title:'Add remote storage (S3/GDrive)',tag:'dvc',viz:'<span class="vz-box vz-input">dvc remote add</span><span class="vz-arrow">→</span><span class="vz-box vz-process">S3/GDrive</span><span class="vz-arrow">→</span><span class="vz-box vz-output">dvc push</span>',code:'# Google Drive (free, 15GB):\ndvc remote add -d myremote gdrive://your-folder-id\ndvc push\n\n# AWS S3:\ndvc remote add -d myremote s3://my-bucket/dvc-store\ndvc push\n\n# Team members:\ngit clone <repo>\ndvc pull  # Downloads exact data versions'},

let currentTab=0, currentStage=0;

function switchTab(i){
  currentTab=i; currentStage=0;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  render();
}

function selectStage(i){
  const t=tabs[currentTab];
  if(i<0||i>=t.stages.length)return;
  currentStage=i; render();
}

function render(){
  const t=tabs[currentTab];
  let html=`<div class="pipeline-card"><div class="pipeline-label">${t.name} — ${t.phases}</div>
    <div class="perf-banner">${t.banner.map((b,i)=>`${i>0?'<div class="perf-divider"></div>':''}<div class="perf-item"><div class="pv" style="color:${b.color}">${b.val}</div><div class="pl">${b.lbl}</div></div>`).join('')}</div>
    <div class="metrics">${t.metrics.map(m=>`<div class="metric"><div class="val" style="color:${m.color}">${m.val}</div><div class="lbl">${m.lbl}</div></div>`).join('')}</div>
    <div class="pipeline">`;

  t.stages.forEach((s,i)=>{
    const active=i===currentStage?' active-stage':'';
    html+=`<div class="pipe-stage${active}" onclick="selectStage(${i})"><div class="st-emoji">${s.emoji}</div><div class="st-name">${s.name}</div><div class="st-time">${s.time}</div><div class="st-desc">${s.desc}</div></div>`;
    if(i<t.stages.length-1) html+='<div class="pipe-arrow">→</div>';
  });

  html+=`</div>`;
  const s=t.stages[currentStage];
  html+=`<div class="substeps"><h4>${s.emoji} ${s.name} — Sub-Operations (${s.time})</h4><div class="substep-grid">`;
  s.substeps.forEach(ss=>{
    html+=`<div class="substep"><span class="ss-num">Step ${ss.n}</span><div class="ss-title">${ss.title}</div>${ss.viz?`<div class="ss-viz">${ss.viz}</div>`:''}<div class="ss-code">${ss.code}</div><span class="ss-tag ${ss.tag}">${ss.tag}</span></div>`;
  });
  html+=`</div></div></div>`;

  document.getElementById('pipelineCard').innerHTML=html;
  document.getElementById('stageLabel').textContent=`Stage ${currentStage+1} / ${t.stages.length}`;
  document.getElementById('prevBtn').disabled=currentStage===0;
  document.getElementById('nextBtn').disabled=currentStage===t.stages.length-1;
}

render();
</script>
