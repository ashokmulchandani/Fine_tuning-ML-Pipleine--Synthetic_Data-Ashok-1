<style>

.topbar .step-dot.done{background:var(--green)}.topbar .step-dot.active{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

.topic-chip.visited{border-color:var(--green);color:var(--green);background:var(--green-bg)}.topic-chip.current{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-bg)}
.fun-fact{background:linear-gradient(135deg,var(--amber-bg),var(--magenta-bg));border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.65rem 1.2rem;margin-bottom:1.5rem;font-size:0.78rem;color:var(--tdim);display:flex;align-items:center;gap:0.6rem}
.fun-fact .bulb{font-size:1.2rem;flex-shrink:0}.fun-fact strong{color:var(--amber)}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}

.compare-card h4{font-family:'Orbitron',sans-serif;font-size:0.72rem;margin-bottom:0.5rem}.compare-card.bad h4{color:var(--red)}.compare-card.good h4{color:var(--green)}.compare-card.best h4{color:var(--cyan)}

.pipeline{display:flex;align-items:center;gap:0.3rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}

.pipeline-stage.highlight{border-color:var(--cyan);background:var(--cyan-bg);color:var(--cyan)}
.pipeline-stage.dvc{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.pipeline-stage.ml{border-color:var(--violet);background:var(--vbg);color:var(--violet)}
.pipeline-stage.ev{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.pipeline-arrow{font-size:0.9rem;color:var(--cyan)}
.code-box{background:#1e1e1e;border:1px solid #333;border-left:3px solid var(--cyan);border-radius:8px;padding:1rem 1.25rem;margin:1rem 0;font-family:'JetBrains Mono',monospace;font-size:0.6rem;line-height:1.8;white-space:pre-wrap;overflow-x:auto;color:#d4d4d4;position:relative}
.code-wrapper{position:relative;margin:1rem 0}.copy-btn2{position:absolute;top:8px;right:8px;font-family:'JetBrains Mono',monospace;font-size:0.55rem;font-weight:600;padding:0.3em 0.7em;border:1px solid #555;border-radius:6px;background:#2d2d2d;color:#ccc;cursor:pointer;transition:0.15s;opacity:0;z-index:5}
.code-wrapper:hover .copy-btn2{opacity:1}.copy-btn2:hover{background:#333;color:var(--cyan);border-color:var(--cyan)}.copy-btn2.copied{opacity:1;background:#2d2d2d;color:var(--green);border-color:var(--green)}
.eq-box{background:rgba(0,0,0,0.4);border-left:3px solid var(--cyan);border-radius:var(--radius-sm);padding:1rem 1.25rem;margin:1rem 0;font-family:'JetBrains Mono',monospace;font-size:0.7rem;line-height:1.8;color:var(--text);white-space:pre-wrap;overflow-x:auto}

.quiz .question{font-family:'Orbitron',sans-serif;font-size:0.82rem;color:var(--text);margin-bottom:0.8rem}
.quiz .options{display:flex;flex-direction:column;gap:0.4rem}
.quiz .option{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:0.6rem 1rem;font-size:0.82rem;color:var(--tdim);cursor:pointer;transition:var(--transition)}
.quiz .option:hover{border-color:var(--cyan);color:var(--cyan)}.quiz .option.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}.quiz .option.wrong{border-color:var(--red);background:#f8514920;color:var(--red)}
.quiz .feedback{display:none;margin-top:0.8rem;padding:0.6rem 1rem;border-radius:6px;font-size:0.82rem}.quiz .feedback.show{display:block}.quiz .feedback.correct{background:var(--green-bg);color:var(--green)}.quiz .feedback.wrong{background:#f8514920;color:var(--red)}
.nav-row{display:flex;gap:1rem;justify-content:center;margin-top:1.5rem}
.nav-btn{font-family:'JetBrains Mono',monospace;font-size:0.8rem;padding:0.6rem 1.8rem;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--tdim);cursor:pointer;transition:var(--transition)}
.nav-btn:hover{border-color:var(--cyan);color:var(--cyan)}.nav-btn:disabled{opacity:0.3;cursor:not-allowed}.nav-btn.primary{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-bg)}
.callout{background:var(--cyan-bg);border:1px solid var(--cyan);border-radius:8px;padding:0.7rem 1rem;margin:0.8rem 0;display:flex;align-items:center;gap:0.6rem;font-size:0.72rem;color:var(--tdim)}
.callout.amber{background:var(--amber-bg);border-color:var(--amber)}
.callout.green{background:var(--green-bg);border-color:var(--green)}
table.param{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:0.55rem;margin:0.5rem 0}
table.param th{padding:0.4rem;border:1px solid var(--border);color:var(--tdim);background:var(--raised)}table.param td{padding:0.4rem;border:1px solid var(--border);text-align:center}
table.param2{width:100%;border-collapse:collapse;font-size:0.82rem;margin:0.5rem 0}
table.param2 th{padding:0.5rem 0.8rem;border-bottom:2px solid var(--border);color:var(--tdim);text-align:left;font-family:'Orbitron',sans-serif;font-size:0.65rem}
table.param2 td{padding:0.5rem 0.8rem;border-bottom:1px solid var(--border);font-size:0.8rem}
.big-stat{text-align:center;margin:1rem 0}.big-stat .number{font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.big-stat .label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--tmut);margin-top:0.2rem}
.anim-box{background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:1rem;margin:0.5rem 0;min-height:140px}
.anim-btn{font-family:'JetBrains Mono',monospace;font-size:0.55rem;padding:0.4em 0.9em;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--tmut);cursor:pointer;transition:var(--transition)}
.anim-btn.active{background:var(--cyan-bg)!important;border-color:var(--cyan)!important;color:var(--cyan)!important}
.anim-btn:hover{border-color:var(--cyan);color:var(--cyan)}
@media(max-width:768px){.app{padding:1rem}.compare-grid,.compare-grid.three{grid-template-columns:1fr}.card{padding:1.2rem}}
</style>

<header class="header"><div class="phase-badge">🔧 PHASE 6B — MLOps & DEPLOYMENT</div><h1>MLOps & Deployment for Fine-Tuned Models</h1><p class="tagline">Track (MLflow) + Version (DVC) + Deploy (vLLM) + Monitor (Evidently) — one pipeline, one command: dvc repro</p></header>

<script>
function toggleTheme(){document.body.classList.toggle('light');document.getElementById('themeToggle').textContent=document.body.classList.contains('light')?'🌙':'☀️';localStorage.setItem('p6b-theme',document.body.classList.contains('light')?'light':'dark')}
if(localStorage.getItem('p6b-theme')==='light'){document.body.classList.add('light');document.getElementById('themeToggle').textContent='🌙'}
(function(){var c=document.getElementById('bgCanvas'),ctx=c.getContext('2d'),p=[];function r(){c.width=window.innerWidth;c.height=window.innerHeight}r();window.addEventListener('resize',r);for(var i=0;i<50;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,rr:Math.random()*2+0.5});function a(){ctx.clearRect(0,0,c.width,c.height);var il=document.body.classList.contains('light');var lc=il?'rgba(9,105,218,0.05)':'rgba(57,210,255,0.05)';var dc=il?'rgba(9,105,218,0.25)':'rgba(57,210,255,0.25)';p.forEach(function(pp){pp.x+=pp.vx;pp.y+=pp.vy;if(pp.x<0)pp.x=c.width;if(pp.x>c.width)pp.x=0;if(pp.y<0)pp.y=c.height;if(pp.y>c.height)pp.y=0});for(var i=0;i<p.length;i++)for(var j=i+1;j<p.length;j++){var dx=p[i].x-p[j].x,dy=p[i].y-p[j].y;if(Math.sqrt(dx*dx+dy*dy)<100){ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[j].x,p[j].y);ctx.strokeStyle=lc;ctx.lineWidth=0.5;ctx.stroke()}}p.forEach(function(pp){ctx.beginPath();ctx.arc(pp.x,pp.y,pp.rr,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill()});requestAnimationFrame(a)}a()})()
function copyCode(el){var txt=el.parentElement.querySelector('.code-box').innerText;navigator.clipboard.writeText(txt).then(function(){el.textContent='✓ Copied';el.classList.add('copied');setTimeout(function(){el.textContent='📋 Copy';el.classList.remove('copied')},2000)})}
function checkQuiz(id,el){var fb=document.getElementById(id+'-fb');var opts=el.parentElement.querySelectorAll('.option');if(el.dataset.correct==='true'){el.classList.add('correct');fb.className='feedback correct show';fb.textContent='✅ Correct! '+{q0:'MLflow tracks experiments, DVC versions datasets. Together they answer: "Which exact code + data produced this model?" Without both, you cannot reproduce any result.',q1:'DVC detects that data changed (new hash), re-runs only the affected stages, and skips the rest. This is the caching superpower — change one CSV row, re-run only what depends on it.',q2:'The run that produced the lowest loss with your production adapter. MLflow makes this trivial — sort by final_loss, click the best run, see every parameter that produced it. All in the UI.',q3:'The model won\'t crash — it will respond with wrong or outdated information. Traditional health checks (200 OK, latency < 500ms) all pass. Only drift detection catches the silent degradation.',q4:'DVC repro traverses the pipeline DAG starting from the changed data. prepare_data re-runs (new hash), train re-runs (new input), evaluate re-runs (new adapter). All cache-missed stages execute in dependency order.',q5:'Batch is for overnight reports (cheap), real-time is for chatbots/APIs (fast), streaming is for IoT/sensors (continuous). For fine-tuned LLMs, real-time via vLLM is the sweet spot — 100x faster than pipeline().',q6:'vLLM uses PagedAttention — a virtual memory system for the KV-cache that eliminates fragmentation. Combined with continuous batching, it achieves 10-100x throughput vs naive pipeline(). Same model, different serving engine.'}[id]||'Great understanding!'}else{el.classList.add('wrong');fb.className='feedback wrong show';fb.textContent='❌ Not quite. The correct answer is A. '+(id==='q0'?'Git versions code. MLflow versions experiments. DVC versions data. You need all three for reproducibility.':id==='q1'?'DVC uses file hashes. If nothing changed, nothing re-runs. This is fundamentally different from Makefiles (timestamps) or CI/CD (always re-run).':id==='q2'?'Every run is recorded automatically. The registry stages (Staging→Production) add governance on top of tracking.':id==='q3'?'AI models degrade silently. Server health checks pass while response quality tanks. Drift detection is NOT optional.':id==='q4'?'DVC creates a DAG from your pipeline definition. Change one input, only downstream dependencies re-run. Everything else uses cached outputs.':id==='q5'?'The pattern matters. Batch for reports, real-time for interactive, streaming for continuous. Pick based on latency requirements and cost tolerance.':id==='q6'?'PagedAttention is the key innovation — it\'s virtual memory for transformer attention. Without it, KV-cache fragmentation wastes 60-80% of VRAM.':'')}opts.forEach(function(o){o.style.pointerEvents='none'});opts.forEach(function(o){if(o.dataset.correct==='true')o.classList.add('correct')})}

const S=[{
  id:'6B.1',title:'MLflow + DVC — The Twin Pillars of Reproducible ML',
  fact:'<strong>Git versions code. DVC versions data. MLflow versions experiments.</strong> Without all three, you cannot answer: "What exact code + data + parameters produced this adapter 3 months ago?"',
  render:()=>`
<div class="slide"><div class="card">
<h2><span class="num">6B.1</span> MLflow + DVC — The Reproducibility Trinity</h2>
<p>Fine-tuning without MLOps is alchemy. You produce an adapter, deploy it, and 3 months later — when something breaks — <strong>you cannot reproduce it.</strong></p>

<div class="compare-grid three">
<div class="compare-card best"><h4>🟢 Git</h4><p><strong>Versions: Code</strong><br><br><code>format_instruction()</code>, training notebook, LoRA config.<br><br>git commit → git push → anyone can see the code.</p></div>
<div class="compare-card good"><h4>🟡 DVC</h4><p><strong>Versions: Data</strong><br><br><code>instruction_data.csv</code> (500KB → 5MB → 50MB).<br><br>dvc add → dvc push → S3/GDrive. Git tracks the .dvc pointer.</p></div>
<div class="compare-card best"><h4>🟣 MLflow</h4><p><strong>Versions: Experiments</strong><br><br>r=8/lr=2e-4 → loss=0.32.<br>r=16/lr=2e-4 → loss=0.28.<br><br>Compare runs side-by-side. Register the best one as "Production".</p></div>
</div>

<h3>The Question Every Fine-Tuning Project Must Answer</h3>
<table class="param2" style="margin:0.5rem 0;">
<tr><th style="width:250px;">Question</th><th>Tool</th><th>How</th></tr>
<tr><td>What code trained this adapter?</td><td style="color:var(--cyan);">Git</td><td style="font-size:0.7rem;">git log adapter_model.safetensors → commit hash</td></tr>
<tr><td>What data was it trained on?</td><td style="color:var(--amber);">DVC</td><td style="font-size:0.7rem;">dvc checkout instruction_data.csv.dvc → exact version</td></tr>
<tr><td>What hyperparameters were used?</td><td style="color:var(--violet);">MLflow</td><td style="font-size:0.7rem;">mlflow ui → click run → params: r, lr, epochs</td></tr>
<tr><td>What was the final loss?</td><td style="color:var(--violet);">MLflow</td><td style="font-size:0.7rem;">mlflow ui → metrics: final_loss=0.32</td></tr>
<tr><td>Can I reproduce the exact adapter?</td><td style="color:var(--green);">All 3</td><td style="font-size:0.7rem;">git checkout <hash> && dvc checkout && dvc repro train</td></tr>
</table>

<div style="text-align:center;margin:1rem 0;">
<svg width="480" height="120" style="max-width:100%;font-family:'JetBrains Mono',monospace;">
  <text x="240" y="15" fill="#8b949e" font-size="9" text-anchor="middle">The Reproducibility Trinity</text>

<div class="quiz" id="q0"><div class="question">Why do you need BOTH MLflow AND DVC — can't you just use Git for everything?</div>
<div class="options">
<div class="option" data-correct="true" onclick="checkQuiz('q0',this)">A. Git cannot handle large files efficiently (50MB+ CSVs, model weights). DVC stores data in S3/GDrive and tracks pointers in Git. MLflow adds the experiment layer — which run produced the best result? Git+DVC re-creates the data; MLflow tells you which parameters to use.</div>

</div><div class="feedback" id="q0-fb"></div></div>

  id:'6B.2',title:'DVC Pipeline — Data Versioning + Reproducible Stages',
  fact:'<strong>DVC detects changes by hashing files.</strong> Change one row in instruction_data.csv → new hash → dvc repro re-runs only the affected stages. Everything else uses cache. No wasted GPU time.',
  render:()=>`
<div class="slide"><div class="card">
<h2><span class="num">6B.2</span> DVC — Git for Data, Pipeline for Reproducibility</h2>
<p>DVC solves two problems: <strong>(1) versioning datasets</strong> too large for Git, and <strong>(2) defining reproducible pipelines</strong> where each stage is cached by its dependencies.</p>

<h3>📐 The 3-Stage DVC Pipeline (our project)</h3>
<div class="pipeline">
<div class="pipeline-stage dvc">📊 prepare_data</div><div class="pipeline-arrow" style="color:var(--amber);">→</div>

<h3>The 3 Steps to Serve Your Adapter with vLLM</h3>
<div class="code-wrapper"><button class="copy-btn2" onclick="copyCode(this)">📋 Copy</button>

<span style="color:#6a9955;"># Step 1: Merge LoRA adapter into base model (Phase 3.10 rule!)</span>
<span style="color:#569cd6;">from</span> peft <span style="color:#569cd6;">import</span> PeftModel
<span style="color:#569cd6;">from</span> transformers <span style="color:#569cd6;">import</span> AutoModelForCausalLM

tokenizer.save_pretrained(<span style="color:#ce9178;">"./merged_model"</span>)

let cur=0;const visited=new Set([0]);
function render(i){cur=i;visited.add(i);
document.getElementById('slideContainer').innerHTML=S[i].render();
document.getElementById('stepLabel').textContent=(i+1)+'/9';
document.getElementById('funFactText').innerHTML='<strong>'+S[i].id+':</strong> '+S[i].fact;
document.getElementById('stepDots').innerHTML=S.map(function(_,j){return '<div class="step-dot'+(j===cur?' active':visited.has(j)?' done':'')+'" onclick="goTo('+j+')"></div>'}).join('');
document.getElementById('topicChips').innerHTML=S.map(function(s,j){return '<span class="topic-chip'+(j===cur?' current':visited.has(j)?' visited':'')+'" onclick="goTo('+j+')">'+s.id+'</span>'}).join('');
document.getElementById('prevBtn').disabled=i===0;
var nb=document.getElementById('nextBtn');
if(i===S.length-1){nb.textContent='✓ Complete';nb.style.background='var(--green)';}
else{nb.textContent='Next →';nb.style.background='';nb.style.color=''}
document.getElementById('slideContainer').scrollIntoView({behavior:'smooth',block:'start'})}
function goTo(i){if(i<0||i>=S.length)return;render(i)}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&cur<S.length-1)goTo(cur+1);if(e.key==='ArrowLeft'&&cur>0)goTo(cur-1)});
render(0);
</script>
