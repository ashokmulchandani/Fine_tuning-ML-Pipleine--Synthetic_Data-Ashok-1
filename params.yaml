# DVC Parameters — Hyperparameters tracked with every run
# Format: dvc experiments run --set-param train.lora_r=16

prepare:
  dataset_path: data/instruction_data.csv
  format: alpaca           # alpaca | chatml | llama_chat
  test_split: 0.1          # 10% held out for validation

train:
  base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules: ["q_proj", "v_proj"]
  quantization: 8bit       # 4bit | 8bit | none
  epochs: 10
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  lr_scheduler: cosine
  warmup_steps: 100
  max_seq_length: 512
  seed: 42

evaluate:
  drift_threshold: 0.5
  min_keyword_overlap: 0.3
  max_response_time_ms: 500
