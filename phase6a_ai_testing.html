<style>
:root{--bg:#06090f;--card:#0d1117;--raised:#161b22;--border:#21262d;--text:#e6edf3;--tdim:#8b949e;--tmut:#484f58;--violet:#a371f7;--vbg:#a371f715;--cyan:#39d2ff;--cyan-bg:#39d2ff15;--amber:#ffb347;--amber-bg:#ffb34715;--green:#3fb950;--green-bg:#3fb95015;--magenta:#ff6ec7;--magenta-bg:#ff6ec715;--red:#f85149;--radius:14px;--radius-sm:8px;--transition:0.3s cubic-bezier(0.4,0,0.2,1)}

.topbar .step-dot.done{background:var(--green)}.topbar .step-dot.active{background:var(--violet);box-shadow:0 0 8px var(--violet)}

.header{text-align:center;padding:3rem 0 1rem}

.topic-chip.visited{border-color:var(--green);color:var(--green);background:var(--green-bg)}.topic-chip.current{border-color:var(--violet);color:var(--violet);background:var(--vbg)}

.fun-fact .bulb{font-size:1.2rem;flex-shrink:0}.fun-fact strong{color:var(--amber)}
.slide{animation:slideIn 0.35s ease}@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}

.card h3{font-family:'Orbitron',sans-serif;font-size:0.85rem;color:var(--violet);margin:1.2rem 0 0.5rem}

.compare-card h4{font-family:'Orbitron',sans-serif;font-size:0.72rem;margin-bottom:0.5rem}.compare-card.bad h4{color:var(--red)}.compare-card.good h4{color:var(--green)}.compare-card.best h4{color:var(--violet)}
.compare-card p{font-size:0.72rem!important;color:var(--tdim)!important}
.compare-grid.three{grid-template-columns:1fr 1fr 1fr}
.pipeline{display:flex;align-items:center;gap:0.3rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}

.pipeline-stage.highlight{border-color:var(--violet);background:var(--vbg);color:var(--violet)}

.pipeline-arrow{font-size:0.9rem;color:var(--violet)}
.eq-box{background:rgba(0,0,0,0.4);border-left:3px solid var(--violet);border-radius:var(--radius-sm);padding:1rem 1.25rem;margin:1rem 0;font-family:'JetBrains Mono',monospace;font-size:0.7rem;line-height:1.8;color:var(--text);white-space:pre-wrap;overflow-x:auto}
.code-box{background:#1e1e1e;border:1px solid #333;border-left:3px solid var(--violet);border-radius:8px;padding:1rem 1.25rem;margin:1rem 0;font-family:'JetBrains Mono',monospace;font-size:0.6rem;line-height:1.8;white-space:pre-wrap;overflow-x:auto;color:#d4d4d4;position:relative}
.code-wrapper{position:relative;margin:1rem 0}.copy-btn2{position:absolute;top:8px;right:8px;font-family:'JetBrains Mono',monospace;font-size:0.55rem;font-weight:600;padding:0.3em 0.7em;border:1px solid #555;border-radius:6px;background:#2d2d2d;color:#ccc;cursor:pointer;transition:0.15s;opacity:0;z-index:5}
.code-wrapper:hover .copy-btn2{opacity:1}.copy-btn2:hover{background:#333;color:var(--violet);border-color:var(--violet)}.copy-btn2.copied{opacity:1;background:#2d2d2d;color:var(--green);border-color:var(--green)}
.quiz{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1.2rem;margin-top:1.5rem}
.quiz .question{font-family:'Orbitron',sans-serif;font-size:0.82rem;color:var(--text);margin-bottom:0.8rem}
.quiz .options{display:flex;flex-direction:column;gap:0.4rem}

.quiz .option:hover{border-color:var(--violet);color:var(--violet)}.quiz .option.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}.quiz .option.wrong{border-color:var(--red);background:#f8514920;color:var(--red)}
.quiz .feedback{display:none;margin-top:0.8rem;padding:0.6rem 1rem;border-radius:6px;font-size:0.82rem}.quiz .feedback.show{display:block}.quiz .feedback.correct{background:var(--green-bg);color:var(--green)}.quiz .feedback.wrong{background:#f8514920;color:var(--red)}
.nav-row{display:flex;gap:1rem;justify-content:center;margin-top:1.5rem}
.nav-btn{font-family:'JetBrains Mono',monospace;font-size:0.8rem;padding:0.6rem 1.8rem;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--tdim);cursor:pointer;transition:var(--transition)}
.nav-btn:hover{border-color:var(--violet);color:var(--violet)}.nav-btn:disabled{opacity:0.3;cursor:not-allowed}.nav-btn.primary{border-color:var(--violet);color:var(--violet);background:var(--vbg)}
.callout{background:var(--vbg);border:1px solid var(--violet);border-radius:8px;padding:0.7rem 1rem;margin:0.8rem 0;display:flex;align-items:center;gap:0.6rem;font-size:0.72rem;color:var(--tdim)}
.callout.amber{background:var(--amber-bg);border-color:var(--amber)}
.callout.green{background:var(--green-bg);border-color:var(--green)}
table.param{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:0.55rem;margin:0.5rem 0}
table.param th{padding:0.4rem;border:1px solid var(--border);color:var(--tdim);background:var(--raised)}table.param td{padding:0.4rem;border:1px solid var(--border);text-align:center}
table.param2{width:100%;border-collapse:collapse;font-size:0.82rem;margin:0.5rem 0}
table.param2 th{padding:0.5rem 0.8rem;border-bottom:2px solid var(--border);color:var(--tdim);text-align:left;font-family:'Orbitron',sans-serif;font-size:0.65rem}
table.param2 td{padding:0.5rem 0.8rem;border-bottom:1px solid var(--border);font-size:0.8rem}
.big-stat{text-align:center;margin:1rem 0}.big-stat .number{font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--violet),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.big-stat .label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--tmut);margin-top:0.2rem}
.test-pyramid{display:flex;flex-direction:column;align-items:center;gap:0.3rem;margin:1rem 0}
.pyramid-layer{font-family:'JetBrains Mono',monospace;font-size:0.55rem;padding:0.6rem 1.2rem;border-radius:8px;text-align:center;border:1px solid var(--border);transition:var(--transition);cursor:pointer}
.pyramid-layer:hover{transform:scale(1.03)}
.pyramid-layer.l4{width:90%;background:var(--green-bg);border-color:var(--green);color:var(--green)}
.pyramid-layer.l3{width:75%;background:var(--vbg);border-color:var(--violet);color:var(--violet)}
.pyramid-layer.l2{width:60%;background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.pyramid-layer.l1{width:45%;background:#f8514920;border-color:var(--red);color:var(--red)}
.anim-box{background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:1rem;margin:0.5rem 0;min-height:140px}
.anim-btn{font-family:'JetBrains Mono',monospace;font-size:0.55rem;padding:0.4em 0.9em;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--tmut);cursor:pointer;transition:var(--transition)}
.anim-btn.active{background:var(--vbg)!important;border-color:var(--violet)!important;color:var(--violet)!important}
.anim-btn:hover{border-color:var(--violet);color:var(--violet)}
@media(max-width:768px){.app{padding:1rem}.compare-grid,.compare-grid.three{grid-template-columns:1fr}.card{padding:1.2rem}}
</style>
</head>
<body>
<canvas class="bg-canvas" id="bgCanvas"></canvas>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>
<nav class="topbar"><span class="logo">FINE-TUNING — PHASE 6A</span><div class="step-dots" id="stepDots"></div><span class="step-label" id="stepLabel">1/10</span></nav>
<div class="app">
<header class="header"><div class="phase-badge">🧪 PHASE 6A — AI TESTING & QA</div><h1>AI Testing & QA for Fine-Tuned Models</h1><p class="tagline">"Review like you're the person getting paged at 3am when this breaks." — 4 testing layers, 10-point checklist, automated CI/CD.</p></header>
<div class="topic-list" id="topicChips"></div>
<div class="fun-fact" id="funFact"><span class="bulb">💡</span><span class="fact-text" id="funFactText"></span></div>
<div id="slideContainer"></div>
<div class="nav-row"><button class="nav-btn" id="prevBtn" onclick="goTo(cur-1)">← Previous</button><button class="nav-btn primary" id="nextBtn" onclick="goTo(cur+1)">Next →</button></div>
</div>

<script>
function toggleTheme(){document.body.classList.toggle('light');document.getElementById('themeToggle').textContent=document.body.classList.contains('light')?'🌙':'☀️';localStorage.setItem('p6a-theme',document.body.classList.contains('light')?'light':'dark')}
if(localStorage.getItem('p6a-theme')==='light'){document.body.classList.add('light');document.getElementById('themeToggle').textContent='🌙'}
(function(){var c=document.getElementById('bgCanvas'),ctx=c.getContext('2d'),p=[];function r(){c.width=window.innerWidth;c.height=window.innerHeight}r();window.addEventListener('resize',r);for(var i=0;i<50;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,rr:Math.random()*2+0.5});function a(){ctx.clearRect(0,0,c.width,c.height);var il=document.body.classList.contains('light');var lc=il?'rgba(130,80,223,0.05)':'rgba(163,113,247,0.05)';var dc=il?'rgba(130,80,223,0.25)':'rgba(163,113,247,0.25)';p.forEach(function(pp){pp.x+=pp.vx;pp.y+=pp.vy;if(pp.x<0)pp.x=c.width;if(pp.x>c.width)pp.x=0;if(pp.y<0)pp.y=c.height;if(pp.y>c.height)pp.y=0});for(var i=0;i<p.length;i++)for(var j=i+1;j<p.length;j++){var dx=p[i].x-p[j].x,dy=p[i].y-p[j].y;if(Math.sqrt(dx*dx+dy*dy)<100){ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[j].x,p[j].y);ctx.strokeStyle=lc;ctx.lineWidth=0.5;ctx.stroke()}}p.forEach(function(pp){ctx.beginPath();ctx.arc(pp.x,pp.y,pp.rr,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill()});requestAnimationFrame(a)}a()})()
function copyCode(el){var txt=el.parentElement.querySelector('.code-box').innerText;navigator.clipboard.writeText(txt).then(function(){el.textContent='✓ Copied';el.classList.add('copied');setTimeout(function(){el.textContent='📋 Copy';el.classList.remove('copied')},2000)})}
function checkQuiz(id,el){var fb=document.getElementById(id+'-fb');var opts=el.parentElement.querySelectorAll('.option');if(el.dataset.correct==='true'){el.classList.add('correct');fb.className='feedback correct show';fb.textContent='✅ Correct! '+{q0:'Traditional software is deterministic. AI outputs vary with temperature, sampling, and floating-point non-determinism. Plus data IS code, and models degrade silently over time.',q1:'Pass 1 checks functionality, Pass 2 checks maintainability, Pass 3 asks the hardest question: what breaks at 3am? This pattern catches failures before production.',q2:'MFT tests basic knowledge, INV ensures robustness to paraphrasing, DIR verifies behavior changes correctly. The anti-hallucination test is a DIR variant — checking the model refuses to invent fake facts.',q3:'The 4-layer model catches issues at every stage: bad data (Layer 1), broken behavior (Layer 2), training failures (Layer 3), silent degradation (Layer 4). Each layer gates the next.',q4:'Pandera validates DataFrame schemas — null checks, type checks, custom validators. It catches the #1 cause of fine-tuning failures: bad training data.',q5:'Data does not stay the same. Users ask about new topics, vocabulary shifts, answer lengths change. Evidently AI compares training distribution to live data — drift > 0.5 means RETRAIN.',q6:'The CI/CD pipeline runs all 4 layers automatically on every git push. If any layer fails, the PR is blocked. No bad model reaches production. Ever.'}[id]||'Great understanding!'}else{el.classList.add('wrong');fb.className='feedback wrong show';fb.textContent='❌ Not quite. The correct answer is A. '+(id==='q0'?'Traditional software is deterministic; AI models are probabilistic, data-dependent, and degrade over time.':id==='q1'?'All three passes matter, but the 3am test (Pass 3) is what separates production engineers from hobbyists.':id==='q2'?'MFT, INV, and DIR each test a different dimension of model behavior — basic knowledge, robustness, and directional correctness.':id==='q3'?'All 4 layers are essential — you cannot skip any. Bad data breaks everything downstream.':id==='q4'?'Data validation is the cheapest insurance policy in ML — 2 lines of Pandera before training saves hours of debugging.':id==='q5'?'Silent degradation is the scariest failure mode. The model doesn\'t crash — it just gets worse.':id==='q6'?'Manual testing doesn\'t scale. CI/CD automation catches issues while you sleep.':'')}opts.forEach(function(o){o.style.pointerEvents='none'});opts.forEach(function(o){if(o.dataset.correct==='true')o.classList.add('correct')})}

const S=[{
  id:'6A.1',title:'Why Testing Fine-Tuned Models is Different',
  fact:'<strong>Traditional software: same input = same output. Fine-tuned model: same input might give different output.</strong> Temperature, sampling, and floating-point non-determinism make testing fundamentally different.',
  render:()=>`
<div class="slide"><div class="card">
<h2><span class="num">6A.1</span> 3 Ways AI Testing is Fundamentally Different</h2>
<p>You cannot test a fine-tuned model the way you test a REST API. Here's why.</p>

<div class="compare-grid">
<div class="compare-card bad"><h4>🔴 Traditional Software</h4>
<p><code style="font-size:0.65rem;">assert add(2,3) == 5</code> — <strong>always passes.</strong> Deterministic. Input→Output is fixed. If it worked yesterday, it works today. Regression tests are exact assertions.</p></div>
<div class="compare-card good"><h4>🟢 Fine-Tuned Model</h4>
<p>Same prompt → <strong>different outputs</strong> (temperature, sampling). Model degrades over time (data drift). Training data IS part of the code. Cannot assert exact string match — need semantic assertions.</p></div>
</div>

<h3>🔑 The 3 Differences That Matter</h3>
<table class="param2" style="margin:0.5rem 0;">
<tr><th style="width:180px;">Difference</th><th>What It Means</th><th>Real Consequence</th></tr>
<tr><td><strong style="color:var(--violet);">1. Non-Deterministic</strong></td><td>Same prompt → different output each time. Temperature > 0 means the model rolls dice.</td><td style="color:var(--red);">Cannot assert exact string match. Must test for keyword presence, sentiment, or semantic similarity.</td></tr>
<tr><td><strong style="color:var(--violet);">2. Data-as-Code</strong></td><td>Training data quality directly determines model quality. Garbage in = garbage out — with 7B parameters amplifying the garbage.</td><td style="color:var(--red);">A null in one training row can poison thousands of predictions. Data validation IS code review.</td></tr>
<tr><td><strong style="color:var(--violet);">3. Degrades Over Time</strong></td><td>Model doesn't crash — it <strong>silently</strong> gets worse. Users ask about new topics you never trained on. Vocabulary shifts.</td><td style="color:var(--red);">No crash alarm goes off. Only monitoring catches it. Drift detection is NOT optional.</td></tr>
</table>

<div style="text-align:center;margin:1rem 0;">
<svg width="500" height="100" style="max-width:100%;font-family:'JetBrains Mono',monospace;">
  <rect x="10" y="10" width="150" height="80" rx="8" fill="none" stroke="#f85149" stroke-width="1.5"/>
  <text x="85" y="40" fill="#f85149" font-size="8" text-anchor="middle">Traditional Bug</text>
  <text x="85" y="58" fill="#8b949e" font-size="7" text-anchor="middle">assert fails →</text>
  <text x="85" y="73" fill="#f85149" font-size="7" text-anchor="middle">LOUD CRASH</text>
  <text x="175" y="55" fill="#8b949e" font-size="10">→</text>
  <rect x="190" y="10" width="300" height="80" rx="8" fill="rgba(163,113,247,0.08)" stroke="#a371f7" stroke-width="1.5"/>
  <text x="340" y="40" fill="#a371f7" font-size="8" text-anchor="middle">AI Model Degradation</text>
  <text x="340" y="58" fill="#8b949e" font-size="7" text-anchor="middle">drift creeps up →</text>
  <text x="340" y="73" fill="#ffb347" font-size="7" text-anchor="middle">SILENT FAILURE</text>
</svg>
</div>

<div class="quiz" id="q0"><div class="question">Why can't you use exact string matching to test a fine-tuned model?</div>
<div class="options">
<div class="option" data-correct="true" onclick="checkQuiz('q0',this)">A. Models are non-deterministic: same prompt produces different outputs due to temperature and sampling. Data changes over time (drift). Assertions must be semantic (keyword presence, sentiment) not exact.</div>
<div class="option" onclick="checkQuiz('q0',this)">B. AI models are too slow to test with string matching</div>
<div class="option" onclick="checkQuiz('q0',this)">C. String matching doesn't work in Python for AI models</div>
</div><div class="feedback" id="q0-fb"></div></div>
</div></div>`
},{
  id:'6A.2',title:'3-Pass PR Review for Fine-Tuned Models',
  fact:'<strong>The 3am test:</strong> "If this model went to production and I got paged at 3am, what would I check first?" That\'s what your tests should cover.',
  render:()=>`
<div class="slide"><div class="card">
<h2><span class="num">6A.2</span> 3-Pass Review — Every Fine-Tuning PR</h2>
<p>Every PR touching a fine-tuned model goes through <strong>3 passes</strong>. Each pass asks a harder question.</p>

<table class="param2" style="margin:0.5rem 0;">

let cur=0;const visited=new Set([0]);
function render(i){cur=i;visited.add(i);
document.getElementById('slideContainer').innerHTML=S[i].render();
document.getElementById('stepLabel').textContent=(i+1)+'/10';
document.getElementById('funFactText').innerHTML='<strong>'+S[i].id+':</strong> '+S[i].fact;
document.getElementById('stepDots').innerHTML=S.map(function(_,j){return '<div class="step-dot'+(j===cur?' active':visited.has(j)?' done':'')+'" onclick="goTo('+j+')"></div>'}).join('');
document.getElementById('topicChips').innerHTML=S.map(function(s,j){return '<span class="topic-chip'+(j===cur?' current':visited.has(j)?' visited':'')+'" onclick="goTo('+j+')">'+s.id+'</span>'}).join('');
document.getElementById('prevBtn').disabled=i===0;
var nb=document.getElementById('nextBtn');
if(i===S.length-1){nb.textContent='✓ Complete';nb.style.background='var(--green)';}
else{nb.textContent='Next →';nb.style.background='';nb.style.color=''}
document.getElementById('slideContainer').scrollIntoView({behavior:'smooth',block:'start'})}
function goTo(i){if(i<0||i>=S.length)return;render(i)}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&cur<S.length-1)goTo(cur+1);if(e.key==='ArrowLeft'&&cur>0)goTo(cur-1)});
render(0);
</script>
